<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR review: annotate diff</title>

<!-- Injection point 3 of 3: replaced with assets/review-fonts.css verbatim.
     Separate file only so this template stays readable - it is a ~300KB base64
     blob. Inlining it is what keeps the generated page at zero network requests. -->
<style id="font-faces">__FONT_CSS__</style>

<style>
  :root{
    /* ----------------------------------------------------------------------
       Design tokens. Every colour is the MODAL colour of a flat region of the
       source design, measured with
       .sisyphus/evidence/reviewer-page-redesign/renders/hist.swift - not
       eyeballed. Anything derived rather than measured is marked "derived".
       ---------------------------------------------------------------------- */

    /* surfaces */
    --paper:#F7F4EF;        /* page + top bar */
    --card:#FFFFFF;         /* narrative / file / finding cards */
    --sunken:#F3EFE8;       /* quiet chips, inline code, Draft pill */
    --rail:#FBFAF7;         /* file-header + hunk-header bands */

    --border:#DBD7D2;       /* all hairlines */
    --track:#E6E0D6;        /* progress-bar track */

    /* ink */
    --ink:#16181A;          /* headings; also the dark footer background */
    --ink-soft:#2C2F31;     /* body copy */
    --muted:#4C4842;        /* secondary text, chip labels */
    --faint:#98918A;        /* hunk headers, meta lines, keyboard hints */
    --on-dark:#F7F4EF;      /* text on the dark footer */
    --on-dark-muted:#9A9A95;
    /* derived: --on-dark at low alpha, for hairlines and fills on the dark card */
    --on-dark-line:rgba(247,244,239,.26);
    --on-dark-fill:rgba(247,244,239,.06);
    --on-dark-fill-hi:rgba(247,244,239,.10);
    --white:#FFFFFF;        /* text on saturated fills; the emphasised dark-card button */

    /* teal - the single accent */
    --teal:#0D7D7D;         /* buttons, progress fill, every link */
    --teal-deep:#0A5F4F;    /* added-line text, Accepted pill ink */
    --mint:#F0F6F4;         /* "in one sentence" callout */
    --mint-pill:#E7F2F0;    /* sidebar active item, Accepted pill */

    /* sage - reserved for the "already on GitHub" vocabulary.
       Measured from the design's before/after panel, where it is the only
       other tinted family present, so the three comment vocabularies stay
       distinguishable without inventing a colour. */
    --sage:#F2F6F0;
    --sage-line:#6B7A63;
    --sage-ink:#4F5B49;     /* derived: --sage-line darkened for text contrast */

    /* diff + semantic */
    --add-bg:#E4F2EE; --add-ink:#0A5F4F;
    --del-bg:#FBE9E5; --del-ink:#8F3B2E;
    --danger:#C2402F;                          /* "N blocking drafts", counts */
    --blocking-bg:#FBE9E5; --blocking-ink:#A53223;
    --warn-bg:#FBF1DE;     --warn-ink:#8A5F13;  /* "Should fix" chip */
    --warn:#B07D1A;                            /* amber counts on --paper */
    /* derived: selection + hover states, absent from the design */
    --add-sel:#D3E9E2; --del-sel:#F6DAD3; --row-hover:#F3EFE8;

    /* ----------------------------------------------------------------------
       Type. Sizes are the design's own values, read from the PDF content
       stream's Tf operators (logical viewport 865x3247 px), corroborated by
       measured ink heights. Body is 15px - the size used by 39 of the text
       runs, more than any other.

       Weight limits are hard constraints of the real fonts, not preferences.
       See assets/fonts/NOTICE.md:
         - Instrument Serif is STATIC REGULAR ONLY. Never ask for >400; the
           browser would synthesise a faux-bold, which on a high-contrast serif
           looks visibly broken. Hence --wt-display and font-synthesis:none.
         - Instrument Sans spans 400-700 only. There is no 200 or 300.
       ---------------------------------------------------------------------- */
    --font-display:"Instrument Serif",Iowan Old Style,Palatino,Georgia,serif;
    --font-sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

    --wt-display:400;       /* the only weight Instrument Serif has */
    --wt-body:400;
    --wt-medium:500;
    --wt-semi:600;

    --fs-h1:44px;    --lh-h1:1.06;
    --fs-footer:28px;
    --fs-h2:25px;
    --fs-title:22px;
    --fs-body:15px;  --lh-body:1.62;
    --fs-meta:13px;
    --fs-small:12.5px;
    --fs-micro:11.5px;
    --fs-label:11px;

    /* layout - the design's measure, from the same 865px logical viewport */
    --measure:660px;
    --sidebar:240px;
    --gutter:48px;
    /* Fallback only. renderShell() overwrites this with the bar's measured
       height and keeps it in sync on resize, so the sticky sidebar offset cannot
       drift out of step with the bar's real size. */
    --topbar-h:64px;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:0;background:var(--paper);color:var(--ink-soft);
       font-family:var(--font-sans);font-weight:var(--wt-body);
       font-size:var(--fs-body);line-height:var(--lh-body);
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--measure);margin:0 auto}

  /* Display face: one weight, and never synthesised. */
  h1,h2,h3,.display{font-family:var(--font-display);font-weight:var(--wt-display);
                    font-synthesis:none;font-synthesis-weight:none;color:var(--ink)}
  h1{font-size:var(--fs-h1);line-height:var(--lh-h1);letter-spacing:-.004em;margin:0 0 10px}
  h2{font-size:var(--fs-h2);line-height:1.16;margin:0 0 14px}
  h3{font-size:var(--fs-title);line-height:1.2;margin:26px 0 10px}
  /* Uppercase section labels inside the narrative are sans, not display. */
  .eyebrow{font-family:var(--font-sans);font-weight:var(--wt-medium);
           font-size:var(--fs-label);text-transform:uppercase;letter-spacing:.085em;
           color:var(--faint)}
  p{margin:0 0 14px}
  a{color:var(--teal)}
  .subtitle{color:var(--faint);font-size:var(--fs-meta);margin-bottom:4px}
  /* Ligatures off on every code surface: JetBrains Mono renders -> as an arrow
     and => as a double arrow by default, which in a diff hides what the source
     literally says and breaks any suggestion the reviewer copies. */
  code,.mono,pre,textarea.code{font-family:var(--font-mono);font-size:var(--fs-small)}
  /* JetBrains Mono ships calt/liga on: it renders -> as an arrow and => as a
     double arrow. In a diff that hides what the source literally says and breaks
     any suggestion the reviewer copies, so it is off on every code surface.
     This list must name every selector that sets font-family:var(--font-mono) -
     grep that string before adding a new one. Deliberately NOT applied globally:
     the body face uses fi/fl ligatures and the design keeps them. */
  code,.mono,pre,textarea.code,.badge,
  .file-head .fname,.file-head .counts,.hunk-header,.diff-line,
  .anno .anno-code,.gh-where,.composer .anchor-note,
  .qa-thread .qa-target,.overflow .of-counts{
    font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}

  /* Host for session-level notices, sitting where the mode banner used to.
     Empty in the common case; the Q&A status block and the pending-question
     card render into it. */
  #shell-notices:not(:empty){margin:0 0 18px}

  /* ---- cards ---- */
  .panel{border:1px solid var(--border);border-radius:12px;background:var(--card);margin:0 0 22px}
  .panel-head{padding:16px 20px;border-bottom:1px solid var(--border);background:var(--card);
              border-radius:12px 12px 0 0;
              display:flex;align-items:baseline;gap:10px;cursor:pointer;user-select:none}
  .panel-title{font-family:var(--font-display);font-weight:var(--wt-display);font-synthesis:none;
               font-size:var(--fs-title);line-height:1.2;color:var(--ink)}
  .panel-sub{font-size:var(--fs-meta);color:var(--faint)}
  .panel-head .toggle{margin-left:auto;color:var(--teal);font-size:var(--fs-meta);
                      font-weight:var(--wt-medium)}
  .panel-body{padding:18px 20px}
  .panel.collapsed .panel-head{border-bottom:0;border-radius:12px}
  .panel.collapsed .panel-body{display:none}
  .callout{background:var(--mint);padding:16px 18px;border-radius:10px;margin:18px 0;
           font-size:var(--fs-body)}
  .callout.tip{background:var(--sage)}
  .callout b{display:block;margin-bottom:6px;font-family:var(--font-sans);
             font-weight:var(--wt-medium);font-size:var(--fs-label);text-transform:uppercase;
             letter-spacing:.085em;color:var(--teal-deep)}

  /* ---- diff heading + filter pills ---- */
  .diff-bar{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin:0 0 16px}
  .diff-bar h2{margin:0}
  .filters{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .pill{font:inherit;font-family:var(--font-sans);font-size:var(--fs-label);
        font-weight:var(--wt-medium);cursor:pointer;border:1px solid var(--border);
        border-radius:999px;padding:5px 13px;background:var(--card);color:var(--muted)}
  .pill:hover{background:var(--sunken);color:var(--ink)}
  /* aria-pressed is the state, so the styling hangs off it rather than a parallel
     class that could drift out of sync with what screen readers are told. */
  .pill[aria-pressed="true"]{background:var(--mint-pill);border-color:var(--teal);
                             color:var(--teal-deep)}
  .file-block[hidden]{display:none}
  .anno[hidden]{display:none}

  /* ---- diff file blocks ---- */
  .file-block{border:1px solid var(--border);border-radius:12px;overflow:hidden;
              margin:0 0 18px;background:var(--card)}
  .file-head{display:flex;align-items:baseline;gap:12px;padding:14px 18px;background:var(--rail);
             border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
  .file-head .fname{font-family:var(--font-mono);font-size:var(--fs-small);
                    font-weight:var(--wt-semi);color:var(--ink);word-break:break-all}
  .file-head .toggle{color:var(--faint);font-size:var(--fs-micro);line-height:1}
  .file-head .counts{margin-left:auto;display:flex;gap:10px;align-items:baseline;
                     font-family:var(--font-mono);font-size:var(--fs-micro)}
  .file-head .adds{color:var(--add-ink)} .file-head .dels{color:var(--del-ink)}
  .file-head .status-chip{background:var(--sunken);color:var(--muted);border-radius:999px;
                          padding:2px 9px;font-family:var(--font-sans);font-size:var(--fs-label);
                          text-transform:capitalize}
  /* A text-only control, for actions that read as links rather than buttons. */
  .link-btn{font:inherit;font-family:var(--font-sans);font-size:var(--fs-meta);
            font-weight:var(--wt-medium);color:var(--teal);background:none;border:0;
            padding:0;cursor:pointer}
  .link-btn:hover{text-decoration:underline}
  .file-body{display:block}
  .file-block.collapsed .file-head{border-bottom:0}
  .file-block.collapsed .file-body{display:none}
  .btn{font:inherit;font-family:var(--font-sans);font-size:var(--fs-small);
       font-weight:var(--wt-medium);cursor:pointer;border:1px solid var(--border);
       border-radius:8px;padding:7px 13px;background:var(--card);color:var(--ink)}
  .btn:hover{background:var(--sunken)}
  .btn.primary{border-color:var(--teal);background:var(--teal);color:var(--white)}
  .btn.primary:hover{filter:brightness(1.08);background:var(--teal)}
  .btn.danger{border-color:var(--border);background:var(--card);color:var(--del-ink)}
  .btn.small{padding:5px 11px;font-size:var(--fs-micro)}
  .no-diff{padding:16px 18px;color:var(--faint);font-size:var(--fs-meta)}

  /* ---- diff lines ----
     Rows tint edge to edge and the gutter carries no rule, so a changed line
     reads as one band rather than three cells. Everything in the row - number,
     marker, code - takes the row's ink, which is what makes add/del legible
     without relying on the background tint alone. */
  .hunk-header{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--faint);
               background:var(--rail);padding:8px 18px;border-top:1px solid var(--border);
               border-bottom:1px solid var(--border)}
  .diff-line{display:flex;font-family:var(--font-mono);font-size:var(--fs-small);
             line-height:1.62;cursor:pointer;color:var(--ink-soft)}
  .diff-line:hover{background:var(--row-hover)}
  .diff-line.selected{background:var(--mint-pill)}
  .diff-line.add{background:var(--add-bg);color:var(--add-ink)}
  .diff-line.add.selected{background:var(--add-sel)}
  .diff-line.del{background:var(--del-bg);color:var(--del-ink)}
  .diff-line.del.selected{background:var(--del-sel)}
  .diff-line.context{background:var(--card)}
  .gutter{flex:0 0 auto;width:52px;text-align:right;padding:0 14px 0 8px;
          color:inherit;opacity:.55;user-select:none}
  .diff-line.context .gutter{color:var(--faint);opacity:1}
  .marker{flex:0 0 auto;width:14px;text-align:left;color:inherit;user-select:none}
  .diff-line.context .marker{color:var(--faint)}
  .ltext{flex:1 1 auto;white-space:pre-wrap;word-break:break-word;padding-right:14px}

  /* ---- annotations (inline) ---- */
  .anno-list{padding:0 18px}
  /* scroll-margin keeps a keyboard-focused finding clear of the sticky top bar,
     which .focus() would otherwise scroll it underneath. */
  .anno{border:1px solid var(--border);border-radius:10px;margin:14px 0;padding:16px 18px;
        background:var(--card);font-size:var(--fs-body);
        scroll-margin-top:calc(var(--topbar-h) + 16px)}
  .anno .anno-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px;
                   font-size:var(--fs-meta);color:var(--muted)}
  .anno .anno-body{white-space:pre-wrap;word-break:break-word;line-height:var(--lh-body)}
  .anno .anno-code{font-family:var(--font-mono);font-size:var(--fs-small);background:var(--sunken);
                   border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-top:12px;
                   white-space:pre-wrap;word-break:break-word}
  .anno .anno-actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  /* Position of this draft in the triage queue, so "how much is left" is
     answerable without scrolling back to the progress bar. */
  .anno .anno-index{font-family:var(--font-mono);font-size:var(--fs-label);color:var(--faint)}
  /* Shortcut hints appear only while the card has focus, because that is exactly
     when the keys do anything - see the keydown handler in buildAnnoNode, which
     is bound per card rather than globally. Printing them on every card at once
     would advertise keys that fire on a different finding than the one read. */
  .anno .anno-kbd{display:none;gap:6px;align-items:center;font-family:var(--font-mono);
                  font-size:var(--fs-label);color:var(--faint)}
  .anno.ai:focus-within .anno-kbd{display:flex}
  .anno .anno-kbd kbd{font:inherit;border:1px solid var(--border);border-radius:4px;
                      background:var(--card);padding:1px 5px;color:var(--muted)}
  .anno.ai:focus{outline:2px solid var(--teal);outline-offset:2px}
  .anno.ai:focus:not(:focus-visible){outline:none}

  /* Accepted AI draft, collapsed. The decision is made, so the card stops
     competing for attention and becomes a one-line receipt: what it was, where
     it lands, and the way back out. The fill is --paper, so the row reads as
     recessed back into the page; --veil measured only dE 1.5 against the white
     card it sits on, which is not a visible surface change. */
  .anno.ai.accepted.collapsed{display:flex;align-items:baseline;gap:12px;padding:11px 16px;
                              background:var(--paper);border-style:solid;border-color:var(--border)}
  .anno-accepted-pill{flex:0 0 auto;background:var(--mint-pill);color:var(--teal-deep);
                      border-radius:999px;padding:2px 10px;font-size:var(--fs-label);
                      font-weight:var(--wt-medium)}
  .anno-accepted-title{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
                       white-space:nowrap;color:var(--ink-soft);font-size:var(--fs-meta)}
  .anno-accepted-where{flex:0 0 auto;font-family:var(--font-mono);font-size:var(--fs-label);
                       color:var(--faint)}
  @media (max-width:700px){
    .anno.ai.accepted.collapsed{flex-wrap:wrap}
    .anno-accepted-title{white-space:normal;flex-basis:100%;order:3}
  }
  /* Background is supporting material, not the finding: it stays quieter than
     .anno-body (smaller, muted, panel-tinted) so the eye lands on the body first. */
  .anno .anno-background{margin-top:8px;border:1px solid var(--border);border-radius:6px;
                         background:var(--sunken);color:var(--muted)}
  .anno .anno-background > summary{padding:5px 10px;cursor:pointer;user-select:none;
                                   font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .anno .anno-background > summary:hover{color:var(--ink)}
  .anno .anno-background-text{padding:0 10px 9px;font-size:12.5px;
                              white-space:pre-wrap;word-break:break-word}
  /* Overlap notice on an AI draft: purple to tie it to the .gh-* "already on
     GitHub" vocabulary, quieter than .anno-body so the finding still reads first.
     It informs triage; it never means the finding was suppressed. */
  .anno .anno-overlap{margin-top:8px;padding:6px 10px;border-radius:6px;
                      border:1px solid var(--sage-line);background:var(--sage);color:var(--sage-ink);
                      font-size:12px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .anno .anno-overlap-badge{font-size:10.5px;font-weight:700;text-transform:uppercase;
                            letter-spacing:.05em;white-space:nowrap}
  .anno .anno-overlap-text{flex:1 1 220px}
  .anno .anno-overlap .gh-link{margin:0}
  .anno.ai{border-style:dashed;border-color:var(--teal);background:var(--mint)}
  .anno.ai.discarded{display:none}
  .anno.ai.accepted{border-style:solid;border-color:var(--add-ink);background:var(--add-bg)}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:var(--fs-label);
         font-weight:var(--wt-medium);font-family:var(--font-mono);border:1px solid}
  .badge-ai{background:var(--mint-pill);border-color:var(--teal);color:var(--teal)}
  .badge-user{background:var(--sunken);border-color:var(--border);color:var(--faint)}
  /* Severity chips carry a tinted fill and matching ink, no outline: at 11px an
     outline plus a fill reads as a button, and these are labels. */
  .chip{border-radius:999px;padding:2px 10px;font-size:var(--fs-label);
        font-weight:var(--wt-medium);border:1px solid transparent}
  .chip.blocking{background:var(--blocking-bg);color:var(--blocking-ink)}
  .chip.should_fix{background:var(--warn-bg);color:var(--warn-ink)}
  .chip.pre_existing{background:var(--sunken);color:var(--muted)}
  .chip.type{background:var(--sunken);color:var(--muted);font-family:var(--font-mono)}

  /* ---- existing GitHub activity (read-only) ----
     A third vocabulary, distinct from .anno (blue/green "this becomes a review
     comment") and .qa-* (dashed grey "this never leaves the page"): solid
     purple-grey, because this content is already ON GitHub and nothing the
     reviewer does here changes it. Critically it never uses the .anno class:
     renderAnnotations() removes every .anno node when it rebuilds, which would
     silently delete these cards. */
  .gh-thread-list{padding:0 14px}
  /* Warm neutral fill, NOT --sage: sage sits within 4/255 of --mint on every
     channel, so using it here made "already on GitHub" and "will become a review
     comment" the same colour at a glance. The sage rail keeps the family identity;
     the fill is what separates it from an actionable draft. */
  .gh-thread{border:1px solid var(--border);border-left:3px solid var(--sage-line);
             border-radius:0 8px 8px 0;margin:8px 0;background:var(--sunken);
             font-size:var(--fs-meta)}
  .gh-thread > summary{padding:7px 12px;cursor:pointer;user-select:none;display:flex;
                       gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .gh-thread > summary:hover{background:var(--sage)}
  .gh-thread.resolved{background:var(--rail);border-left-color:var(--faint);opacity:.85}
  .gh-thread.outdated{border-left-style:dashed}
  .gh-thread-body{padding:2px 12px 10px}
  .badge-gh{background:var(--sage);border-color:var(--sage-line);color:var(--sage-ink)}
  .chip.gh-resolved{background:var(--add-bg);border-color:var(--add-ink);color:var(--add-ink)}
  .chip.gh-open{background:var(--warn-bg);border-color:var(--warn);color:var(--warn-ink)}
  .chip.gh-outdated{background:var(--sunken);border-color:var(--border);color:var(--faint)}
  .chip.gh-state{background:var(--sage);border-color:var(--sage-line);color:var(--sage-ink)}
  .gh-where{font-family:var(--font-mono);font-size:11.5px}
  .gh-count{margin-left:auto;font-size:11.5px}
  .gh-msg{border-top:1px solid var(--border);padding:8px 0 2px;margin:0}
  .gh-msg:first-child{border-top:0}
  .gh-who{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
  .gh-who .gh-author{font-weight:600;color:var(--ink)}
  .gh-body{white-space:pre-wrap;word-break:break-word;margin-top:3px}
  .gh-note{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:6px}
  .gh-link{font-size:11.5px}
  .gh-link a{color:var(--teal);text-decoration:none}
  .gh-link a:hover{text-decoration:underline}
  .gh-panel .panel-head .gh-sub{margin-left:8px;font-weight:400;font-size:12px;color:var(--muted)}
  .gh-section{margin:0 0 14px}
  .gh-section:last-child{margin-bottom:0}
  .gh-section h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;
                 letter-spacing:.05em;color:var(--muted)}
  .gh-empty{font-size:13px;color:var(--muted);font-style:italic;margin:0}
  .gh-warn{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn-ink);
           border-radius:6px;padding:6px 10px;margin:0 0 10px;font-size:12px}
  .gh-unavailable{border:1px solid var(--del-ink);background:var(--del-bg);color:var(--del-ink);
                  border-radius:6px;padding:6px 10px;margin:0 0 10px;font-size:12px}
  .gh-review{border:1px solid var(--border);border-radius:8px;padding:8px 12px;
             margin:6px 0;background:var(--card);font-size:13px}

  /* ---- composer ---- */
  .composer{border:1px solid var(--teal);border-radius:8px;margin:8px 0;padding:12px;background:var(--mint)}
  .composer .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:12.5px}
  .composer label{font-weight:600;color:var(--muted)}
  .composer select,.composer textarea{font:inherit;font-size:13px;border:1px solid var(--border);
                                       border-radius:7px;padding:6px 9px;background:var(--card);color:var(--ink)}
  .composer textarea{width:100%;min-height:60px;resize:vertical}
  .composer textarea.code{font-family:var(--font-mono);font-size:12.5px}
  .composer .anchor-note{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
  .composer .actions{display:flex;gap:8px;margin-top:6px}

  /* ---- live Q&A (ask the agent) ----
     Deliberately NOT the .composer / .anno vocabulary: those are blue-accented
     "this becomes a review comment" surfaces. Questions never reach GitHub, so
     every Q&A surface is grey/dashed and carries its own label. Same tokens,
     different voice. */
  .qa-panel .panel-head .qa-sub{margin-left:8px;font-weight:400;font-size:12px;color:var(--muted)}
  /* The design's top card. It sits in #shell-notices, above the title, because an
     outstanding question is the one thing that should be read before the diff. */
  .qa-status-block{margin:0 0 18px;background:var(--mint);border:1px solid var(--teal);
                   border-radius:10px;padding:14px 16px}
  .qa-status-line{font-size:var(--fs-meta);color:var(--teal-deep);margin:0;
                  font-weight:var(--wt-medium)}
  .qa-status-line ~ .qa-status-line{margin-top:6px;font-weight:var(--wt-body);
                                    color:var(--muted)}
  .qa-empty{font-size:var(--fs-meta);color:var(--muted);font-style:italic;margin:0 0 8px}
  /* Host for inline line-range threads: sits between two .diff-line rows, so it
     borrows .anno-list's gutter to line up with annotation cards on the same row. */
  .qa-thread-list{padding:0 14px}
  .qa-thread{border-left:3px dashed var(--faint);background:var(--sunken);
             border-radius:0 6px 6px 0;padding:8px 12px;margin:8px 0}
  .qa-thread .qa-target{font-family:var(--font-mono);
                        font-size:11.5px;color:var(--muted);margin-bottom:6px}
  /* Inline threads have no panel subtitle above them to say "this never ships",
     so each one carries the same promise in one quiet line. It repeats down the
     diff, so it stays lowercase and unboxed. */
  .qa-thread .qa-note{font-size:11px;color:var(--muted);margin-bottom:4px}
  .qa-msg{margin:6px 0;font-size:12.5px}
  .qa-label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;
            letter-spacing:.05em;color:var(--muted)}
  .qa-text{white-space:pre-wrap;word-break:break-word;color:var(--ink)}
  .qa-text.qa-muted{color:var(--muted);font-style:italic}
  /* Who is speaking, without importing chat bubbles: an 11px "YOU" against an 11px
     "AGENT" was the only difference between the two roles, which reads as one voice.
     The answer steps in and carries a solid accent rail; the question stays flush
     against the thread edge with a hairline one, so the alternation is visible from
     the shape alone. Indent is margin on the answer only - .qa-thread already owns a
     dashed rail and 12px of padding, and shifting the question too would fight it.
     No tinted blocks and no avatars: this page stays documentary. */
  .qa-q{padding-left:9px;border-left:2px solid var(--border)}
  .qa-a{margin-left:16px;padding-left:9px;border-left:2px solid var(--teal)}
  .qa-q > .qa-label{color:var(--faint)}
  .qa-a > .qa-label{font-weight:700;color:var(--teal)}
  .qa-pending{font-size:12px;color:var(--muted);font-style:italic;margin:6px 0}
  .qa-notice{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn-ink);
             border-radius:6px;padding:6px 10px;margin:6px 0;font-size:12px}
  .qa-error{border:1px solid var(--del-ink);background:var(--del-bg);color:var(--del-ink);
            border-radius:6px;padding:6px 10px;margin:6px 0;font-size:12px;
            display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .qa-composer{border:1px dashed var(--faint);border-radius:8px;margin:8px 0;
               padding:10px 12px;background:var(--sunken)}
  .qa-composer .qa-composer-label{margin-bottom:6px;font-size:11px;font-weight:600;
                                  text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .qa-composer textarea{font:inherit;font-size:13px;width:100%;min-height:56px;resize:vertical;
                        border:1px solid var(--border);border-radius:7px;padding:6px 9px;
                        background:var(--card);color:var(--ink)}
  .qa-composer .qa-count{margin-top:2px;text-align:right;font-size:11px;color:var(--muted)}
  .qa-composer .actions{display:flex;gap:8px;margin-top:6px}
  .qa-mic-btn.recording{border-color:var(--del-ink);background:var(--del-bg);color:var(--del-ink)}
  /* Read-aloud is started from an answer that can sit thousands of pixels down the
     diff, so the control that ends it cannot live in the page flow: fixed, it is
     wherever the reviewer already is. The offset used to be 108px, clearing the
     96px the body reserved for a position:fixed footer. That footer is now a card
     in normal flow and the reservation is gone, so the pill sits one gap off the
     viewport floor. z-index stays below .topbar's 30 so a pinned bar wins.
     Rounded like the .badge vocabulary: an overlay, not a button in a row. */
  .qa-stop-speaking-btn{position:fixed;right:20px;bottom:24px;z-index:21;
                        border-radius:999px;border-color:var(--muted);
                        background:var(--card);box-shadow:0 2px 10px rgba(22,24,26,.14)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn:disabled:hover{background:var(--sunken)}

  /* ---- overflow ---- */
  .overflow{border:1px dashed var(--border);border-radius:10px;padding:14px 16px;margin:0 0 16px;background:var(--sunken)}
  .overflow h3{margin-top:0}
  .overflow ul{margin:0;padding-left:18px} .overflow li{font-size:13px;margin:4px 0}
  .overflow a{color:var(--teal);text-decoration:none} .overflow a:hover{text-decoration:underline}
  .overflow .of-counts{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);margin-left:6px}

  /* ---- shell: sticky top bar ---- */
  .topbar{position:sticky;top:0;z-index:30;background:var(--paper);
          border-bottom:1px solid var(--border)}
  .topbar-inner{max-width:calc(var(--sidebar) + var(--gutter) + var(--measure));
                margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
  .status-dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--teal)}
  /* The dot carries state, so it cannot be the only channel: renderShell() also
     writes a title attribute with the same information in words. */
  .status-dot.is-local{background:var(--warn)}
  .status-dot.is-static{background:transparent;box-shadow:inset 0 0 0 2px var(--faint)}
  .topbar-repo{font-size:var(--fs-meta);color:var(--ink);font-weight:var(--wt-medium)}
  .topbar-mode{font-size:var(--fs-meta);color:var(--faint)}
  .progress{margin-left:auto;display:flex;align-items:center;gap:10px}
  .progress-text{font-size:var(--fs-meta);color:var(--muted);white-space:nowrap}
  .progress-track{display:block;width:112px;height:5px;border-radius:999px;background:var(--track)}
  .progress-fill{display:block;height:100%;width:0;border-radius:999px;background:var(--teal);
                 transition:width .18s ease}
  .progress[hidden]{display:none}
  /* The submit button carries the right-push itself, because .progress starts
     hidden and a bare `.progress ~ .btn-solid` would still match it - sibling
     combinators ignore [hidden]. Only a VISIBLE progress block hands the push
     over to itself. */
  .topbar .btn-solid{margin-left:auto}
  .progress:not([hidden]) ~ .btn-solid{margin-left:0}
  .btn-solid{font:inherit;font-family:var(--font-sans);font-size:var(--fs-meta);
             font-weight:var(--wt-semi);cursor:pointer;border:0;border-radius:9px;
             padding:9px 18px;background:var(--teal);color:var(--white)}
  .btn-solid:hover{filter:brightness(1.08)}
  .btn-solid:disabled{opacity:.5;cursor:default;filter:none}

  /* ---- shell: two-column layout ---- */
  .layout{max-width:calc(var(--sidebar) + var(--gutter) + var(--measure));
          margin:0 auto;padding:34px 20px 72px;
          display:grid;grid-template-columns:var(--sidebar) minmax(0,var(--measure));
          gap:0 var(--gutter);align-items:start}
  .sidebar{position:sticky;top:calc(var(--topbar-h) + 22px);align-self:start;
           font-size:var(--fs-meta)}
  .main{min-width:0}
  .toc{display:flex;flex-direction:column;gap:1px}
  .toc-group{margin:0 0 6px;padding:0 10px;color:var(--faint);font-size:var(--fs-micro)}
  .toc-group.spaced{margin-top:18px}
  .toc a{display:flex;align-items:baseline;gap:8px;padding:6px 10px;border-radius:7px;
         color:var(--muted);text-decoration:none}
  .toc a:hover{background:var(--sunken)}
  .toc a.is-active{background:var(--mint-pill);color:var(--ink)}
  .toc a.is-empty{color:var(--faint)}
  .toc .toc-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toc .toc-label.mono{font-size:var(--fs-micro)}
  .toc .toc-count{margin-left:auto;font-family:var(--font-mono);font-size:var(--fs-micro);
                  color:var(--faint)}
  .toc .toc-count.has-blocking{color:var(--danger)}
  .toc .toc-count.has-drafts{color:var(--warn)}
  .sidebar-note{margin:18px 10px 0;padding-top:16px;border-top:1px solid var(--border);
                color:var(--faint);font-size:var(--fs-micro);line-height:1.5}

  /* ---- shell: dark closing card ----
     Sits in normal flow at the end of .main, NOT position:fixed and NOT inside
     .wrap. Outside .wrap because renderQaPanel() appends to .wrap, so anything
     placed inside it would end up above late-arriving Q&A panels. */
  .closing{background:var(--ink);color:var(--on-dark);border-radius:14px;
           padding:26px 28px;margin:40px 0 0}
  .closing-head{font-family:var(--font-display);font-weight:var(--wt-display);
                font-synthesis:none;font-size:var(--fs-footer);line-height:1.2;
                color:var(--on-dark);margin:0 0 8px}
  .closing-head b{font-weight:var(--wt-display)}
  .closing-note{color:var(--on-dark-muted);font-size:var(--fs-micro);line-height:1.55;margin:0}
  .closing-general{margin:20px 0 0}
  .closing-general textarea{width:100%;min-height:44px;resize:vertical;font:inherit;
                            font-family:var(--font-sans);font-size:var(--fs-meta);
                            border:1px solid var(--on-dark-line);border-radius:9px;
                            padding:9px 11px;background:var(--on-dark-fill);color:var(--on-dark)}
  .closing-general textarea::placeholder{color:var(--on-dark-muted)}
  .closing-btns{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 0}
  .closing-btns button{font:inherit;font-family:var(--font-sans);font-size:var(--fs-meta);
                       font-weight:var(--wt-semi);cursor:pointer;border-radius:9px;padding:10px 18px}
  #download-btn,#copy-fixlist-btn{border:1px solid var(--on-dark-line);
                                  background:transparent;color:var(--on-dark)}
  #download-btn:hover,#copy-fixlist-btn:hover{background:var(--on-dark-fill-hi)}
  #submit-btn{border:1px solid var(--on-dark);background:var(--on-dark);color:var(--ink)}
  #submit-btn:hover{background:var(--white)}
  #submit-btn:disabled{opacity:.45;cursor:default}

  /* The stop-speaking pill was parked above the old fixed footer (bottom:108px
     = 96px reservation + gap). That footer is gone, so it now sits one gap off
     the viewport floor and body no longer reserves space for it. */
  @media (max-width:1080px){
    .layout{grid-template-columns:minmax(0,1fr);gap:0}
    .sidebar{position:static;margin:0 0 26px;max-width:var(--measure)}
    .sidebar-note{margin-left:0}
    .toc{flex-direction:row;flex-wrap:wrap;gap:4px}
    .toc-group{width:100%}
  }
  @media (max-width:600px){
    .layout{padding:22px 12px 56px}
    .topbar-inner{padding:10px 12px;gap:10px;flex-wrap:wrap}
    .progress{width:100%;margin-left:0;order:3}
    .topbar .btn-solid,.progress ~ .btn-solid{margin-left:auto}
    .closing{padding:20px 18px;border-radius:12px}
    .closing-btns button{flex:1 1 auto}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <span class="status-dot" id="status-dot"></span>
    <span class="topbar-repo mono" id="topbar-repo"></span>
    <span class="topbar-mode" id="topbar-mode">reviewer mode</span>
    <div class="progress" id="progress" hidden>
      <span class="progress-text" id="progress-text"></span>
      <span class="progress-track"><span class="progress-fill" id="progress-fill"></span></span>
    </div>
    <button class="btn-solid" id="submit-btn-top" type="button">Submit review</button>
  </div>
</header>

<div class="layout">

  <aside class="sidebar">
    <nav class="toc" id="toc" aria-label="On this page"></nav>
    <p class="sidebar-note" id="sidebar-note"></p>
  </aside>

  <div class="main">
    <div class="wrap">

      <div class="subtitle" id="page-meta">Pull request · reviewer mode</div>
      <h1 id="page-title">PR review</h1>

      <div id="shell-notices"></div>

      <section class="panel" id="narrative-panel">
        <div class="panel-head" data-toggle="narrative-panel">
          <span class="panel-title">Narrative</span>
          <span class="panel-sub">why this change exists</span>
          <span class="toggle">Collapse</span>
        </div>
        <div class="panel-body">
          <div id="narrative">__NARRATIVE_HTML__</div>
        </div>
      </section>

      <div id="activity"></div>

      <div class="diff-bar">
        <h2 id="diff-heading">Diff</h2>
        <div class="filters" id="filters">
          <button class="pill" id="f-drafts" aria-pressed="false">Only files with drafts</button>
          <button class="pill" id="f-decided" aria-pressed="false">Hide decided</button>
          <button class="pill" id="f-collapse">Collapse all</button>
        </div>
      </div>
      <div id="files"></div>
      <div id="overflow"></div>

    </div>

    <section class="closing">
      <p class="closing-head" id="counts-line">
        <b id="c-user">0</b> comments · <b id="c-ai">0 of 0</b> AI drafts accepted · <span id="c-overlap-wrap" hidden><b id="c-overlap">0</b> already discussed · </span><b id="c-warn">0</b> warnings
      </p>
      <p class="closing-note mono" id="closing-note"></p>
      <div class="closing-general">
        <textarea id="general-comment" placeholder="General review comment (optional)…"></textarea>
      </div>
      <div class="closing-btns">
        <button id="download-btn" type="button">Download decisions</button>
        <button id="copy-fixlist-btn" type="button">Copy fix-list</button>
        <button id="submit-btn" type="button">Submit review</button>
      </div>
    </section>
  </div>

</div>

<!--
  ============================ INJECTION POINTS ============================
  The agent replaces exactly two markers when it builds a page from this
  template (each marker appears once, and only once, in this file):
    1. The REVIEW-DATA marker inside the script#review-data tag below: the T1
       "Diff JSON contract" object (references/annotation-schema.md §2).
       Escape "</" as "<\/" in the dumped JSON (json.dumps(...).replace("</",
       "<\\/")): a diff containing "</script>" would otherwise close that
       script element at HTML-parse time and truncate the data
       (references/reviewer-ui.md §1).
    2. The NARRATIVE-HTML marker inside div#narrative above: the pre-rendered
       narrative HTML fragment.
  ========================================================================

  sample data
  -----------
  To test this template standalone (no agent, no server):
    1. Copy this file:  cp assets/review-template.html /tmp/review-standalone.html
    2. In the copy, overwrite the REVIEW-DATA marker (the placeholder text inside
       the script#review-data tag) with the T1 worked-example Diff JSON from
       references/annotation-schema.md §2 ("Worked example: diff JSON").
    3. Overwrite the NARRATIVE-HTML marker (inside div#narrative) with any HTML
       fragment, e.g. the narrativeHtml string from that same §2 example.
    4. Serve the folder and open the copy in a browser:
         cd /tmp && python3 -m http.server 8000
         then visit  127.0.0.1:8000/review-standalone.html

  The §2 example renders two files (src/utils/formatDate.js and
  src/utils/formatDate.test.js), one overflow file, and one AI draft (a-2) that
  appears inline with an "AI draft" badge, a dashed border, a "blocking"
  severity chip, and Accept / Edit / Discard buttons. It starts EXCLUDED
  (accepted:false) so the footer reads "0 of 1 AI drafts accepted" until you
  click Accept.
-->
<script id="review-data" type="application/json">__REVIEW_DATA__</script>

<script>
(function () {
  "use strict";

  var DATA;
  try {
    DATA = JSON.parse(document.getElementById("review-data").textContent);
  } catch (e) {
    DATA = null;
  }
  if (!DATA || typeof DATA !== "object") {
    DATA = {
      mode: "local", repo: null, prNumber: null, prUrl: null,
      branch: "unknown-branch", headRefOid: null,
      files: [], overflowFiles: [], aiAnnotations: []
    };
  }
  var files = Array.isArray(DATA.files) ? DATA.files : [];
  var overflowFiles = Array.isArray(DATA.overflowFiles) ? DATA.overflowFiles : [];

  var isLive = !!document.querySelector('meta[name="pr-review-live"]');

  // ---- live Q&A session plumbing (annotation-schema.md §5) ----
  // The channel needs BOTH halves: the live marker (a server is serving this page)
  // and a sessionNonce in the diff JSON (that server was started with --session-dir
  // /--nonce). Without a nonce every POST /ask would 404 or 409, so the affordances
  // must not exist at all. qaEnabled is therefore the single gate for every Q&A
  // surface, and it can only ever be true on an isLive page.
  var sessionNonce = typeof DATA.sessionNonce === "string" && DATA.sessionNonce ? DATA.sessionNonce : null;
  var qaEnabled = isLive && sessionNonce !== null;
  var MAX_QUESTION_CHARS = 4000;   // §5.6; server answers 413 above this
  var MAX_PENDING = 5;             // §5.6; Ask affordances disable at this many
  var POLL_INTERVAL_MS = 2000;     // §5.5 "the page polls this endpoint periodically"
  var SLOW_ANSWER_MS = 180000;     // 3 minutes → non-blocking "no response yet" notice
  var POLL_FAILURES_BEFORE_END = 3;
  var qaQuestions = [];            // in ask order; each entry is a question + its answer
  var qaByQid = {};
  // qids whose question text was dictated, in whole or in part. Client-side only:
  // the wire payload and the question files on disk are unchanged by dictation.
  var voiceQids = new Set();
  // Speech-out state. It lives here, never in the DOM: renderQa() rebuilds every Q&A
  // node on each poll tick, so anything parked in an element is lost every ~2s.
  var speechQueue = [];            // pending chunks, FIFO, spoken one at a time
  var speechUtterance = null;      // strong ref: a collected utterance stops mid-word
  var speechSpeaking = false;      // "the queue is running", the Stop control's source
  var speechRun = 0;               // bumped on cancel; stale end/error handlers no-op
  var speechOwnerQid = null;       // qid whose answer the queue belongs to, or null.
                                   // The per-answer toggle reads its label off this:
                                   // the buttons themselves are rebuilt every tick.
  var speechVoice = null;          // best voice found, or null for "browser default"
  var speechVoicePicked = false;   // true once a non-empty voice list was actually scored
  var speechVoiceBound = false;    // the voiceschanged listener is registered once
  var qaCounter = 0;
  var qaState = "active";          // "active" | "ended" (server gone) | "stale" (409)
  var qaPollTimer = null;
  var qaPollFailures = 0;
  var qaPanel = null;              // fallback host for threads that cannot be anchored
  var qaPanelBody = null;
  var qaStatusHost = null;         // session status/notices, independent of that panel
  var submitted = false;

  // Reviewer-namespaced key ONLY; must never collide with author mode's "pr-review:<branch>".
  //
  // `reviewRunId` scopes the draft to ONE page build. Without it the key is just
  // repo/PR, so a second review of the same PR rehydrates the first run's draft:
  // annotations anchored to a diff that has since moved, and worse, the saved
  // aiState for id "ai-1" silently reapplying to whatever "ai-1" means this time,
  // so a finding could load pre-accepted or pre-discarded on its own. Existing
  // GitHub activity makes this visible rather than causing it (comments you
  // already posted now render beside a stale draft of themselves), so it is fixed
  // here. Pages built without a reviewRunId keep the old key and the old
  // behaviour.
  var reviewRunId = typeof DATA.reviewRunId === "string" && DATA.reviewRunId
    ? DATA.reviewRunId : null;
  var STORE_KEY;
  if (DATA.mode === "pr" && DATA.repo != null && DATA.prNumber != null) {
    STORE_KEY = "pr-review:reviewer:" + DATA.repo + "/" + DATA.prNumber;
  } else {
    STORE_KEY = "pr-review:reviewer:local:" + (DATA.branch || "unknown-branch");
  }
  if (reviewRunId) STORE_KEY += ":" + reviewRunId;

  var userAnnotations = [];
  var aiAnnotations = [];
  var generalComment = "";
  var idCounter = 1;
  var AI_COPY_FIELDS = ["severity", "reasoning", "disproof", "background"];

  // ---- existing GitHub review activity (annotation-schema.md §2a) ----
  // READ-ONLY, and kept in its own variable for one specific reason: buildPayload()
  // serializes userAnnotations and aiAnnotations, so anything NOT in those two
  // arrays cannot be submitted. That is the whole guarantee that previous GitHub
  // comments are never re-posted as new ones. Never push these into either array,
  // never give them an `accepted` field, and never write them to localStorage
  // (they are a server-side snapshot, re-fetched on every page build).
  var activity = (DATA.existingActivity && typeof DATA.existingActivity === "object")
    ? DATA.existingActivity : null;

  function activityList(key) {
    return activity && Array.isArray(activity[key]) ? activity[key] : [];
  }

  // A thread anchors inline only when GitHub still reports a CURRENT line for it.
  // `originalLine` is deliberately not consulted: it is where the comment used to
  // point, and using it would attach old feedback to whatever code now occupies
  // that number. Outdated and file-level threads go to the panel instead.
  function threadIsInlineable(t) {
    return t.subjectType !== "FILE" && !t.isOutdated &&
      t.filePath != null && t.line != null && t.side != null;
  }

  function seedFromData() {
    (DATA.aiAnnotations || []).forEach(function (a) {
      // AI drafts default EXCLUDED (accepted:false) unless the injected data set it true.
      var annotation = {
        id: a.id != null ? a.id : nextId(),
        scope: a.scope, type: a.type, filePath: a.filePath,
        lineStart: a.lineStart, lineEnd: a.lineEnd, side: a.side,
        body: a.body || "", suggestedCode: a.suggestedCode,
        origin: "ai", accepted: a.accepted === true,
        _discarded: false
      };
      AI_COPY_FIELDS.forEach(function (field) { annotation[field] = a[field]; });
      aiAnnotations.push(annotation);
    });
  }

  function nextId() { return "u-" + (idCounter++); }

  function loadDraft() {
    var raw;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { raw = null; }
    if (!raw) return;
    var saved;
    try { saved = JSON.parse(raw); } catch (e) { return; }
    if (!saved || typeof saved !== "object") return;
    if (Array.isArray(saved.userAnnotations)) userAnnotations = saved.userAnnotations;
    if (typeof saved.generalComment === "string") generalComment = saved.generalComment;
    if (saved.aiState && typeof saved.aiState === "object") {
      aiAnnotations.forEach(function (a) {
        var st = saved.aiState[a.id];
        if (st) {
          if (typeof st.accepted === "boolean") a.accepted = st.accepted;
          if (typeof st._discarded === "boolean") a._discarded = st._discarded;
          if (typeof st.body === "string") a.body = st.body;
          if (typeof st.suggestedCode === "string") a.suggestedCode = st.suggestedCode;

    }
  }

  function saveDraft() {
    var aiState = {};

        body: a.body, suggestedCode: a.suggestedCode

    });

      userAnnotations: userAnnotations,

  function el(tag, cls, text) {

    if (text != null) n.textContent = text;
    return n;
  }

  var isPr = DATA.mode === "pr";

  // The full-width mode banner is gone. Its three jobs are now split across the
  // shell: the top-bar dot carries the mode, the sidebar note carries "nothing
  // is posted until you submit", and the closing card repeats it at the point of
  // action. #shell-notices took over the banner's position as the host for
  // session-level notices, which is where the Q&A status block lands.
  function renderShell() {
    var label = isPr
      ? ((DATA.repo || "") + (DATA.prNumber != null ? " #" + DATA.prNumber : "")).trim()
      : (DATA.branch || "");

    document.getElementById("page-meta").textContent =

    var title = document.getElementById("page-title");
    if (typeof DATA.title === "string" && DATA.title.trim()) {

    } else {
      title.textContent = isPr
        ? "Review " + (label || "pull request")
        : "Review branch " + (DATA.branch || "");
    }

    // Precedence is deliberate: no server is the most limiting state, so it wins
    // over local, which in turn wins over live. Colour is never the only channel.
    var dot = document.getElementById("status-dot");
    var note = document.getElementById("closing-note");
    var side = document.getElementById("sidebar-note");
    if (!isLive) {
      dot.className = "status-dot is-static";
      dot.title = "No server. Ask is unavailable and Submit downloads decisions instead of posting.";
      note.textContent = "no server \u00b7 Download decisions hands the file back to the agent";
      side.textContent = "No server is attached, so nothing can be posted. Your decisions come back as a downloaded file.";
    } else if (!isPr) {
      dot.className = "status-dot is-local";
      dot.title = "Local branch. Nothing will be posted anywhere.";
      note.textContent = "local branch \u00b7 annotations return to the agent as a fix-list";
      side.textContent = "Nothing is posted anywhere. Annotations return to the agent as a fix-list.";
    } else {
      dot.className = "status-dot";
      dot.title = "Live. Submitting creates one pending review on GitHub, which you finalise there.";
      note.textContent = "submitting creates one pending review on GitHub \u00b7 you finalise the verdict there";
      side.textContent = "Nothing is posted to GitHub until you submit. One pending review, drafts only.";
    }

    syncTopbarHeight();
    renderToc();
  }

  function syncTopbarHeight() {
    var bar = document.querySelector(".topbar");
    if (!bar) return;
    document.documentElement.style.setProperty("--topbar-h", bar.offsetHeight + "px");
  }

  // The bar's height is measured, so every event that can change it has to
  // re-measure. Font loading is the non-obvious one: the embedded faces resolve
  // asynchronously even though they carry no network cost, and when they swap in,
  // the bar's text re-wraps and its height changes underneath an earlier reading.
  // Missing this left --topbar-h wrong by a whole wrapped row at some widths.
  function watchTopbarHeight() {
    window.addEventListener("resize", syncTopbarHeight);
    if (document.fonts && typeof document.fonts.ready === "object" &&
        typeof document.fonts.ready.then === "function") {
      document.fonts.ready.then(syncTopbarHeight);
    }
    // Belt and braces for the same race: ResizeObserver watches the element
    // itself, so it catches height changes from causes not enumerated here.
    if (typeof ResizeObserver === "function") {
      var bar = document.querySelector(".topbar");
      if (bar) new ResizeObserver(syncTopbarHeight).observe(bar);
    }
  }

  // Skeleton only: the per-file draft counts and the active-section highlight are
  // driven from review state, so they are wired where that state is updated.
  function renderToc() {
    var toc = document.getElementById("toc");
    toc.innerHTML = "";

    toc.appendChild(el("p", "toc-group", "On this page"));
    toc.appendChild(tocLink("narrative-panel", "Narrative", false));
    if (activity) toc.appendChild(tocLink("activity", "Previous activity", false));

    var heading = "Diff \u00b7 " + files.length + (files.length === 1 ? " file" : " files");
    toc.appendChild(el("p", "toc-group spaced", heading));
    files.forEach(function (f) {
      toc.appendChild(tocLink(null, shortName(f.filename), true, f.filename));
    });
  }

  function shortName(path) {
    var parts = String(path || "").split("/");
    return parts[parts.length - 1] || path;
  }

  function tocLink(targetId, text, isMono, filePath) {
    var a = el("a", null);
    a.href = "#";
    if (filePath != null) a.dataset.tocFile = filePath;
    if (targetId != null) a.dataset.tocTarget = targetId;
    var label = el("span", "toc-label" + (isMono ? " mono" : ""), text);
    a.appendChild(label);
    a.appendChild(el("span", "toc-count", ""));
    a.addEventListener("click", function (ev) {
      ev.preventDefault();
      var target = filePath ? findFileBlock(filePath)
                            : document.getElementById(targetId);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    return a;
  }

  var filesRoot = document.getElementById("files");

  function renderFiles() {
    filesRoot.innerHTML = "";
    if (!files.length) {
      filesRoot.appendChild(el("p", "no-diff", "No files to render."));
      return;
    }
    files.forEach(function (f) { filesRoot.appendChild(renderFile(f)); });
  }

  function renderFile(f) {
    var block = el("div", "file-block");
    block.dataset.file = f.filename;

    var head = el("div", "file-head");
    head.appendChild(el("span", "toggle", "\u25be"));
    head.appendChild(el("span", "fname", f.filename));
    var counts = el("span", "counts");
    // "modified" is the default and the +/- figures already say so. Only a status
    // worth reading (added, removed, renamed) earns a chip.
    var status = f.status || "modified";
    if (status !== "modified") counts.appendChild(el("span", "status-chip", status));
    counts.appendChild(el("span", "adds", "+" + (f.additions || 0)));
    counts.appendChild(el("span", "dels", "-" + (f.deletions || 0)));
    head.appendChild(counts);

    var body = el("div", "file-body");

    // File-level comment lives in the header, as a link beside the counts.
    // stopPropagation is required: the header itself toggles collapse.
    var fileBtn = el("button", "link-btn", "File comment");
    fileBtn.addEventListener("click", function (ev) {
      ev.stopPropagation();
      if (block.classList.contains("collapsed")) setCollapsed(false);
      openComposer(body, null, f.filename, null);
    });
    head.appendChild(fileBtn);

    function setCollapsed(on) {
      block.classList.toggle("collapsed", on);
      head.querySelector(".toggle").textContent = on ? "\u25b8" : "\u25be";
      syncFilterPills();
    }
    head.addEventListener("click", function () {
      setCollapsed(!block.classList.contains("collapsed"));
    });
    block.appendChild(head);

    if (f.truncated || !Array.isArray(f.hunks) || !f.hunks.length) {
      body.appendChild(el("div", "no-diff", "No diff to render (binary, too large, or rename-only)."));
    } else {
      f.hunks.forEach(function (h) { body.appendChild(renderHunk(f, h)); });
    }
    var anchor = el("div", "anno-list");
    anchor.dataset.fileAnchor = f.filename;
    body.appendChild(anchor);

    block.appendChild(body);
    return block;
  }

  var selection = null; // { fileEl, filename, side, lines:[{line,text,el}] }

  function renderHunk(f, h) {
    var frag = document.createDocumentFragment();
    frag.appendChild(el("div", "hunk-header", h.header || ""));
    (h.lines || []).forEach(function (ln) {
      var row = el("div", "diff-line " + (ln.kind || "context"));
      var side = ln.kind === "del" ? "LEFT" : "RIGHT";
      var num = ln.kind === "del" ? ln.oldLine : ln.newLine;
      row.dataset.filename = f.filename;
      row.dataset.side = side;
      row.dataset.line = num == null ? "" : String(num);

      // One gutter, not two. It shows `num` - the same number `data-line` carries,
      // so the digits a reviewer reads are the digits the posted comment anchors
      // to. A second column showing the opposite side's numbering would be the
      // one number a comment can never refer to.
      var gutter = el("span", "gutter", num == null ? "" : String(num));
      var marker = el("span", "marker", ln.kind === "add" ? "+" : ln.kind === "del" ? "-" : " ");
      var text = el("span", "ltext", ln.text != null ? ln.text : "");
      row.appendChild(gutter); row.appendChild(marker); row.appendChild(text);

      row.addEventListener("mousedown", function (ev) { beginSelect(f, row, ev); });
      row.addEventListener("mouseenter", function (ev) { extendSelect(f, row, ev); });
      row.addEventListener("mouseup", function (ev) { endSelect(f, row); });
      frag.appendChild(row);
    });
    return frag;
  }

  var dragging = false;
  function clearSelectionEls() {
    Array.prototype.forEach.call(document.querySelectorAll(".diff-line.selected"),
      function (n) { n.classList.remove("selected"); });
  }
  function beginSelect(f, row, ev) {
    if (row.dataset.line === "") return; // no anchorable number
    dragging = true;
    clearSelectionEls();
    selection = { filename: f.filename, side: row.dataset.side, rows: [row] };
    row.classList.add("selected");
  }
  function extendSelect(f, row, ev) {
    if (!dragging || !selection) return;
    if (f.filename !== selection.filename) return;
    if (row.dataset.side !== selection.side) return; // stay on one side
    if (row.dataset.line === "") return;
    if (selection.rows.indexOf(row) === -1) {
      selection.rows.push(row);
      row.classList.add("selected");
    }
  }
  function endSelect(f, row) {
    if (!dragging) {
      if (row.dataset.line === "") return;
      clearSelectionEls();
      selection = { filename: f.filename, side: row.dataset.side, rows: [row] };
      row.classList.add("selected");
    }
    dragging = false;
    if (!selection || !selection.rows.length) return;
    openComposerForSelection();
  }

  function selectionLineRange() {
    var nums = selection.rows.map(function (r) { return parseInt(r.dataset.line, 10); })
      .filter(function (n) { return !isNaN(n); }).sort(function (a, b) { return a - b; });
    return { start: nums[0], end: nums[nums.length - 1] };
  }
  function selectionText() {
    return selection.rows
      .slice()
      .sort(function (a, b) { return parseInt(a.dataset.line, 10) - parseInt(b.dataset.line, 10); })
      .map(function (r) { return r.querySelector(".ltext").textContent; })
      .join("\n");
  }

  function openComposerForSelection() {
    var range = selectionLineRange();
    var lastRow = selection.rows[selection.rows.length - 1];
    openComposer(
      lastRow.parentNode === filesRoot ? lastRow : findFileBody(selection.filename),
      { start: range.start, end: range.end, side: selection.side, seedText: selectionText() },
      selection.filename,
      lastRow
    );
  }

  function findFileBody(filename) {
    var block = filesRoot.querySelector('.file-block[data-file="' + cssEscape(filename) + '"]');
    return block ? block.querySelector(".file-body") : filesRoot;
  }
  function cssEscape(s) { return String(s).replace(/["\\]/g, "\\$&"); }
  function openComposer(container, lineInfo, filename, insertAfter, editing) {
    var existing = document.querySelector(".composer");
    if (existing) existing.remove();

    var c = el("div", "composer");

    var scope = lineInfo ? "line" : "file";
    var row1 = el("div", "row");
    var typeLabel = el("label", null, "Type");
    var typeSel = document.createElement("select");
    ["comment", "suggestion", "concern"].forEach(function (t) {
      var o = document.createElement("option"); o.value = t; o.textContent = t; typeSel.appendChild(o);
    });
    row1.appendChild(typeLabel); row1.appendChild(typeSel);

    var anchorNote = el("span", "anchor-note");
    if (lineInfo) {
      var rangeStr = lineInfo.start === lineInfo.end ? String(lineInfo.start)
        : lineInfo.start + "-" + lineInfo.end;
      anchorNote.textContent = filename + " : line " + rangeStr + " (" + lineInfo.side + ")";
    } else {
      anchorNote.textContent = filename + " : file-level comment";
    }
    row1.appendChild(anchorNote);
    c.appendChild(row1);

    var ta = document.createElement("textarea");
    ta.placeholder = "Your comment (markdown)…";
    c.appendChild(ta);

    var codeTa = document.createElement("textarea");
    codeTa.className = "code";
    codeTa.placeholder = "Suggested replacement code…";
    codeTa.style.display = "none";
    if (lineInfo && lineInfo.seedText != null) codeTa.value = lineInfo.seedText;
    c.appendChild(codeTa);

    typeSel.addEventListener("change", function () {
      codeTa.style.display = typeSel.value === "suggestion" ? "block" : "none";
    });
    if (editing) {
      typeSel.value = editing.type || "comment";
      ta.value = editing.body || "";
      if (editing.type === "suggestion") {
        codeTa.style.display = "block";
        codeTa.value = editing.suggestedCode || "";
      }
    }

    var actions = el("div", "actions");
    var saveBtn = el("button", "btn primary small", editing ? "Save" : "Add comment");
    var cancelBtn = el("button", "btn small", "Cancel");
    actions.appendChild(saveBtn); actions.appendChild(cancelBtn);
    // Same selection, second destination: instead of becoming a review comment,
    // this line range becomes a question to the agent. Live-and-nonce only, and
    // only for line ranges, because §5.3's "lines" target needs a line range.
    if (qaEnabled && lineInfo && !editing) {
      // Sitting in the same actions row as "Add comment", "Ask about this" read as
      // that textarea's submit button. It names the other destination instead now, so
      // the row offers a choice of where the text goes rather than two ways to send it.
      var askLinesBtn = el("button", "btn small qa-ask-lines-btn", "Ask the agent instead");
      askLinesBtn.title = "Send this to the agent as a question. It never becomes a review comment.";
      askLinesBtn.addEventListener("click", function () {
        var parent = c.parentNode;
        var anchor = c.nextSibling;
        c.remove();
        clearSelectionEls();
        openQaComposer({
          target: {
            type: "lines", filePath: filename,
            lineStart: lineInfo.start, lineEnd: lineInfo.end, side: lineInfo.side
          },
          threadId: null,
          parentQid: null,
          container: parent,
          insertBefore: anchor,
          label: "Ask the agent about " + anchorNote.textContent,
          seedText: ta.value
        });
      });
      actions.appendChild(askLinesBtn);
    }
    c.appendChild(actions);

    cancelBtn.addEventListener("click", function () { c.remove(); clearSelectionEls(); });

    saveBtn.addEventListener("click", function () {
      var body = ta.value.trim();
      if (!body && typeSel.value !== "suggestion") { ta.focus(); return; }
      var type = typeSel.value;
      var suggestedCode = type === "suggestion" ? codeTa.value : undefined;

      if (editing && editing.origin === "ai") {
        // Editing an AI draft: update it in place and mark accepted.
        editing.type = type;
        editing.body = body;
        editing.suggestedCode = suggestedCode;
        editing.accepted = true;
        editing._discarded = false;
      } else if (editing) {
        editing.type = type;
        editing.body = body;
        editing.suggestedCode = suggestedCode;
      } else {
        var anno = {
          id: nextId(),
          scope: scope,
          type: type,
          filePath: filename,
          lineStart: lineInfo ? lineInfo.start : null,
          lineEnd: lineInfo ? lineInfo.end : null,
          side: lineInfo ? lineInfo.side : null,
          body: body,
          origin: "user",
          accepted: true
        };
        if (type === "suggestion") anno.suggestedCode = suggestedCode;
        userAnnotations.push(anno);
      }
      c.remove();
      clearSelectionEls();
      saveDraft();
      renderAnnotations();
      renderCounts();
    });

    if (insertAfter && insertAfter.parentNode) {
      insertAfter.parentNode.insertBefore(c, insertAfter.nextSibling);
    } else {
      container.appendChild(c);
    }
    ta.focus();
  }

  function renderAnnotations() {
    Array.prototype.forEach.call(document.querySelectorAll(".anno"), function (n) { n.remove(); });

    var all = aiAnnotations.concat(userAnnotations);
    all.forEach(function (a) {
      if (a.origin === "ai" && a._discarded) return;
      var node = buildAnnoNode(a);
      placeAnno(a, node);
    });
    // Cards were just rebuilt, so any thread hanging under one went with them.
    if (qaEnabled) { renderAnnotationThreads(); updateAskAvailability(); }
  }

  function placeAnno(a, node) {
    if (a.scope === "general") return; // general lives in footer only
    var container = findAnnoContainer(a);
    if (container) container.appendChild(node);
  }

  // ---- shared line anchoring ----
  // ONE row lookup behind every "put this under line N of file F" placement:
  // annotation cards, inline Q&A threads, and the unanchored-warning count. Kept
  // in one place so the three can never disagree about what "anchorable" means.
  function findFileBlock(filePath) {
    if (!filePath) return null;
    return filesRoot.querySelector('.file-block[data-file="' + cssEscape(filePath) + '"]');
  }

  function findDiffRow(filePath, side, line) {
    var block = findFileBlock(filePath);
    if (!block || line == null) return null;
    var rows = block.querySelectorAll('.diff-line[data-side="' + side + '"]');
    for (var i = 0; i < rows.length; i++) {
      if (parseInt(rows[i].dataset.line, 10) === line) return rows[i];
    }
    return null;
  }

  function anchorKey(filePath, side, line) {
    return filePath + "\u241f" + side + "\u241f" + line;   // unit separator: never in a path
  }

  // Three different collections can hang under one diff row, and their order is
  // NOT cosmetic: existing GitHub activity is the context the reviewer is reacting
  // to, so it must sit above their own draft. Reading a reply before the comment it
  // answers makes the thread nonsense. Ordering used to fall out of whichever
  // renderer happened to run first, which flipped depending on triage clicks and
  // Q&A polls; this list makes it explicit instead.
  var ROW_HOST_ORDER = ["gh-thread-list", "anno-list", "qa-thread-list"];

  // Where a new host belongs among the hosts already under this row: immediately
  // before the first sibling that outranks it, else immediately after the row.
  function rowHostSlot(row, cls) {
    var rank = ROW_HOST_ORDER.indexOf(cls);
    var node = row.nextSibling;
    while (node && node.nodeType === 1) {
      var otherRank = ROW_HOST_ORDER.indexOf(node.className);
      if (otherRank === -1 || otherRank > rank) break;
      node = node.nextSibling;
    }
    return node;
  }

  // Stable holder under a diff row: looked up by key FIRST, created only
  // if missing. A fresh holder per call would strand one empty div per render pass,
  // and both render paths re-run (renderQa on every ~2s poll, renderAnnotations on
  // every triage click).
  function ensureRowHost(row, cls, attr, key) {
    var parent = row.parentNode;
    var host = parent.querySelector("." + cls + "[data-" + attr + '="' + cssEscape(key) + '"]');
    if (host) return host;
    host = el("div", cls);
    host.setAttribute("data-" + attr, key);
    parent.insertBefore(host, rowHostSlot(row, cls));
    return host;
  }

  function findAnnoContainer(a) {
    var block = findFileBlock(a.filePath);
    if (!block) return null;
    if (a.scope === "line" && a.lineStart != null) {
      var row = findDiffRow(a.filePath, a.side, a.lineEnd);
      if (row) {
        return ensureRowHost(row, "anno-list", "line-anchor",
          anchorKey(a.filePath, a.side, a.lineEnd));
      }
    }
    return block.querySelector('.anno-list[data-file-anchor="' + cssEscape(a.filePath) + '"]');
  }

  // The enum is the wire format; these are the words a reviewer reads. Keep the
  // two apart so the payload never depends on presentation.
  var SEVERITY_LABEL = { blocking: "Blocking", should_fix: "Should fix", pre_existing: "Pre-existing" };
  function severityLabel(sev) {
    return SEVERITY_LABEL[sev] || sev;
  }

  // Where an accepted finding will land, in the words the reviewer needs to trust
  // it: the anchor, then the promise that it is still only a draft.
  function annoWhere(a) {
    if (a.scope === "file") return "file-level \u00b7 will post as a review comment";
    if (a.lineStart == null) return "will post as a review comment";
    var r = a.lineStart === a.lineEnd ? String(a.lineStart) : a.lineStart + "-" + a.lineEnd;
    return "line " + r + " \u00b7 will post as a review comment";
  }

  function buildCollapsedAnnoNode(a, onUndo, onExpand) {
    var n = el("div", "anno ai accepted collapsed");
    n.dataset.annoId = a.id;
    n.appendChild(el("span", "anno-accepted-pill", "Accepted"));
    var title = el("span", "anno-accepted-title", (a.body || "").split("\n")[0]);
    title.title = a.body || "";
    n.appendChild(title);
    n.appendChild(el("span", "anno-accepted-where", annoWhere(a)));
    var undo = el("button", "link-btn", "Undo");
    undo.addEventListener("click", function (ev) { ev.stopPropagation(); onUndo(); });
    n.appendChild(undo);
    // Clicking the receipt reopens the card without undoing the decision - the
    // reviewer may want to re-read or edit what they accepted.
    n.addEventListener("click", onExpand);
    return n;
  }

  function buildAnnoNode(a) {
    // An accepted draft shows as a one-line receipt until the reviewer asks for it
    // back. `_expanded` is deliberately transient: stripInternal() keeps it out of
    // the payload and saveDraft() persists only accepted/_discarded/body, so a
    // reload returns to the tidy collapsed view.
    if (a.origin === "ai" && a.accepted && !a._expanded) {
      return buildCollapsedAnnoNode(a,
        function () {
          a.accepted = false; a._expanded = false;
          saveDraft(); renderAnnotations(); renderCounts();
        },
        function () {
          a._expanded = true;
          renderAnnotations();
        });
    }

    var cls = "anno " + (a.origin === "ai" ? "ai" : "user");
    if (a.origin === "ai" && a.accepted) cls += " accepted";
    var n = el("div", cls);
    n.dataset.annoId = a.id;

    var meta = el("div", "anno-meta");
    if (a.origin === "ai") {
      meta.appendChild(badge("badge badge-ai", "AI draft"));
      if (a.severity) meta.appendChild(chip("chip " + a.severity, severityLabel(a.severity)));
    } else {
      meta.appendChild(badge("badge badge-user", "you"));
    }
    meta.appendChild(chip("chip type", a.type));
    if (a.scope === "line" && a.lineStart != null) {
      var rangeStr = a.lineStart === a.lineEnd ? String(a.lineStart) : a.lineStart + "-" + a.lineEnd;
      meta.appendChild(el("span", null, "line " + rangeStr + " (" + a.side + ")"));
    } else if (a.scope === "file") {
      meta.appendChild(el("span", null, "file-level"));
    }
    n.appendChild(meta);

    n.appendChild(el("div", "anno-body", a.body || ""));
    if (a.type === "suggestion" && a.suggestedCode != null) {
      n.appendChild(el("div", "anno-code", a.suggestedCode));
    }
    // AI drafts only. A user annotation was typed by the reviewer moments ago with
    // the existing thread rendered directly above it, so repeating the fact back at
    // them is nagging; an AI draft is the one that needs a triage decision.
    if (a.origin === "ai") {
      var overlap = overlappingThreads(a);
      if (overlap.length) n.appendChild(buildOverlapNote(a, overlap));
    }
    if (a.origin === "ai" && a.reasoning) {
      var r = el("div", "anno-meta");
      r.appendChild(el("em", null, "Why flagged: " + a.reasoning));
      n.appendChild(r);
    }
    if (a.origin === "ai" && a.disproof) {
      var dp = el("div", "anno-meta");
      dp.appendChild(el("em", null, "Prove this wrong: " + a.disproof));
      n.appendChild(dp);
    }
    if (a.origin === "ai" && a.background) {
      n.appendChild(buildBackgroundBlock(a.background));
    }

    var actions = el("div", "anno-actions");
    if (a.origin === "ai") {
      var acceptBtn = el("button", "btn small primary", a.accepted ? "\u2713 Accepted" : "Accept");
      acceptBtn.addEventListener("click", function () {
        a.accepted = !a.accepted;
        // Accepting is a finished decision, so the card gives up its space. Undoing
        // re-opens it, otherwise it would collapse into a receipt for a draft that
        // is no longer accepted.
        a._expanded = false;
        saveDraft(); renderAnnotations(); renderCounts();
      });
      var editBtn = el("button", "btn small", "Edit");
      editBtn.addEventListener("click", function () {
        openComposer(n.parentNode, annoLineInfo(a), a.filePath, n, a);
      });
      var discardBtn = el("button", "btn small danger", "Discard");
      discardBtn.addEventListener("click", function () {
        a._discarded = true; a.accepted = false;
        saveDraft(); renderAnnotations(); renderCounts();
      });
      actions.appendChild(acceptBtn); actions.appendChild(editBtn); actions.appendChild(discardBtn);
      if (qaEnabled) {
        // Live-and-nonce only (qaEnabled implies isLive, matching #submit-btn):
        // both affordances need the review server's Q&A channel, so the
        // no-python3 download-only page must not offer them. Deliberately NOT
        // gated on DATA.mode, unlike #copy-fixlist-btn: both modes consume
        // background (`pr` ships it to GitHub inside a collapsed <details>,
        // `local` prints a "Background:" paragraph in the fix-list).
        var askBtn = el("button", "btn small qa-ask-btn", "Ask");
        askBtn.addEventListener("click", function () {
          openQaComposer({
            target: { type: "annotation", annotationId: a.id },
            threadId: null,
            parentQid: null,
            container: n,
            label: "Ask the agent about this finding",
            afterClose: function () { renderQa(); }
          });
        });
        actions.appendChild(askBtn);
        if (!a.background) {
          // The `!a.background` guard is what removes this button once an answer
          // to a background-request lands: attachAnswers() writes answer.background
          // onto the annotation and re-renders, so the collapsed <details> above
          // appears in the same pass that this button disappears.
          var bgBtn = el("button", "btn small request-background-btn", "Request background");
          bgBtn.addEventListener("click", function () {
            requestBackground(a, bgBtn, n);
          });
          actions.appendChild(bgBtn);
        }
      }
    } else {
      var uEdit = el("button", "btn small", "Edit");
      uEdit.addEventListener("click", function () {
        openComposer(n.parentNode, annoLineInfo(a), a.filePath, n, a);
      });
      var uDel = el("button", "btn small danger", "Delete");
      uDel.addEventListener("click", function () {
        var idx = userAnnotations.indexOf(a);
        if (idx !== -1) userAnnotations.splice(idx, 1);
        saveDraft(); renderAnnotations(); renderCounts();
      });
      actions.appendChild(uEdit); actions.appendChild(uDel);
    }

    if (a.origin === "ai") {
      var queue = aiAnnotations.filter(function (x) { return !x._discarded; });
      var pos = queue.indexOf(a);
      if (pos !== -1) {
        actions.appendChild(el("span", "anno-index", (pos + 1) + " of " + queue.length));
      }

      var hints = el("div", "anno-kbd");
      [["a", "accept"], ["e", "edit"], ["x", "discard"]].forEach(function (pair) {
        var k = el("kbd", null, pair[0]);
        hints.appendChild(k);
        hints.appendChild(el("span", null, pair[1]));
      });
      actions.appendChild(hints);

      // Shortcuts are bound to the card, not the document, so a key only ever
      // acts on the finding that has focus. The typing guard still matters: the
      // Edit composer and the Ask box render *inside* this node, so an unguarded
      // handler would discard a finding while the reviewer typed the word "box".
      n.tabIndex = 0;
      n.addEventListener("keydown", function (ev) {
        if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
        var t = ev.target;
        var tag = t && t.tagName ? t.tagName.toLowerCase() : "";
        if (tag === "input" || tag === "textarea" || tag === "select" || (t && t.isContentEditable)) return;
        var btn = ev.key === "a" ? acceptBtn : ev.key === "e" ? editBtn : ev.key === "x" ? discardBtn : null;
        if (!btn) return;
        ev.preventDefault();
        var id = a.id;
        btn.click();
        // Keyboard triage is a run of decisions, and btn.click() rebuilt every
        // card, so focus has to be handed to the next undecided finding or the
        // run stops after one. Mouse users are left alone - stealing focus would
        // scroll the page out from under them.
        if (ev.key !== "e") focusDraftAfter(id);
      });
    }

    n.appendChild(actions);
    return n;
  }

  // Filters are presentation only: they hide nodes, they never touch annotation
  // state, so what gets submitted is identical whatever is toggled here.
  var filters = { onlyDrafts: false, hideDecided: false };

  function applyFilters() {
    var t = triage();
    Array.prototype.forEach.call(document.querySelectorAll(".file-block"), function (block) {
      var slot = t.byFile[block.dataset.file];
      var hasDrafts = !!(slot && slot.total);
      block.hidden = filters.onlyDrafts && !hasDrafts;
    });
    // "Decided" hides the accepted receipts and nothing else. Discarded drafts are
    // already absent from the DOM, so they need no hiding.
    Array.prototype.forEach.call(document.querySelectorAll(".anno.ai.accepted"), function (n) {
      n.hidden = filters.hideDecided;
    });
    syncFilterPills();
  }

  function syncFilterPills() {
    var d = document.getElementById("f-drafts");
    var k = document.getElementById("f-decided");
    var c = document.getElementById("f-collapse");
    if (!d) return;
    d.setAttribute("aria-pressed", String(filters.onlyDrafts));
    k.setAttribute("aria-pressed", String(filters.hideDecided));
    // Label reflects what the button will do next, read from the live DOM rather
    // than a remembered flag, which would go stale the moment a file header is
    // clicked directly.
    c.textContent = anyFileExpanded() ? "Collapse all" : "Expand all";
  }

  function anyFileExpanded() {
    return !!document.querySelector(".file-block:not(.collapsed)");
  }

  function initFilters() {
    document.getElementById("f-drafts").addEventListener("click", function () {
      filters.onlyDrafts = !filters.onlyDrafts;
      applyFilters();
    });
    document.getElementById("f-decided").addEventListener("click", function () {
      filters.hideDecided = !filters.hideDecided;
      applyFilters();
    });
    document.getElementById("f-collapse").addEventListener("click", function () {
      var collapse = anyFileExpanded();
      Array.prototype.forEach.call(document.querySelectorAll(".file-block"), function (b) {
        b.classList.toggle("collapsed", collapse);
        var tg = b.querySelector(".file-head .toggle");
        if (tg) tg.textContent = collapse ? "\u25b8" : "\u25be";
      });
      syncFilterPills();
    });
  }

  // Highlights the file the reader is actually looking at.
  //
  // Deliberately a scroll listener rather than an IntersectionObserver: an
  // observer fails *silently* here (no error, just no highlight ever), and it
  // cannot be exercised in a headless render, so the feature would ship unproven.
  // Reading geometry on scroll is verifiable and behaves identically everywhere.
  // The trigger line sits below the sticky bar, so a file counts as current only
  // once it clears the chrome.
  function activeFileAt(line) {
    var blocks = document.querySelectorAll(".file-block");
