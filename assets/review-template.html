    var straddling = null, lastAbove = null;
    Array.prototype.forEach.call(blocks, function (b) {
      if (b.hidden) return;
      var r = b.getBoundingClientRect();
      if (r.top <= line && r.bottom > line) straddling = b.dataset.file;
      if (r.top <= line) lastAbove = b.dataset.file;
    });
    // Between two blocks nothing straddles the line, so the file just above it is
    // still the one being read.
    return straddling !== null ? straddling : lastAbove;
  }

  function initScrollSpy() {
    var bar = document.querySelector(".topbar");

    // No requestAnimationFrame throttle on purpose. A "skip if already queued"
    // guard deadlocks the moment rAF does not run - every later scroll is dropped
    // because the flag never clears - and rAF is exactly as unobservable here as
    // the observer this replaced. The work is a handful of getBoundingClientRect
    // calls, bounded by the schema's 50-file cap, and browsers already coalesce
    // scroll events to at most one per frame.
    function update() {
      var current = activeFileAt((bar ? bar.offsetHeight : 64) + 24);
      Array.prototype.forEach.call(document.querySelectorAll("#toc a[data-toc-file]"), function (a) {
        a.classList.toggle("is-active", current !== null && a.dataset.tocFile === current);
      });
    }

    window.addEventListener("scroll", update, { passive: true });
    window.addEventListener("resize", update);
    update();
  }

  function focusDraftAfter(id) {
    var cards = Array.prototype.slice.call(document.querySelectorAll(".anno.ai"));
    var open = function (c) { return !c.classList.contains("collapsed"); };
    var from = 0;
    for (var i = 0; i < cards.length; i++) {
      if (cards[i].dataset.annoId === id) { from = i + 1; break; }
    }
    for (var j = from; j < cards.length; j++) {
      if (open(cards[j])) { cards[j].focus(); return; }
    }
    // Nothing left below: fall back to the first still-open finding rather than
    // dropping focus to <body>, which would end the keyboard run silently.
    for (var k = 0; k < cards.length; k++) {
      if (open(cards[k])) { cards[k].focus(); return; }
    }
  }

  function annoLineInfo(a) {
    if (a.scope !== "line") return null;
    return { start: a.lineStart, end: a.lineEnd, side: a.side, seedText: a.suggestedCode };
  }

  // Supporting context for an AI finding (annotation-schema.md §1), never the
  // finding itself: a real <details> element with no `open` attribute, so it is
  // collapsed until the reader asks for it. Built node-by-node and filled with
  // textContent (via el()) so an agent-authored string cannot inject markup.
  function buildBackgroundBlock(text) {
    var d = document.createElement("details");
    d.className = "anno-background";
    d.appendChild(el("summary", null, "Background"));
    d.appendChild(el("div", "anno-background-text", text));
    return d;
  }

  function badge(cls, txt) { return el("span", cls, txt); }
  function chip(cls, txt) { return el("span", cls, txt); }

  function renderOverflow() {
    var root = document.getElementById("overflow");
    root.innerHTML = "";
    if (!overflowFiles.length) return;
    var box = el("div", "overflow");
    box.appendChild(el("h3", null, overflowFiles.length + " more file" +
      (overflowFiles.length === 1 ? "" : "s") + " (view on GitHub)"));
    var ul = document.createElement("ul");
    overflowFiles.forEach(function (of) {
      var li = document.createElement("li");
      if (of.url) {
        var a = document.createElement("a");
        a.href = of.url; a.textContent = of.filename;
        a.target = "_blank"; a.rel = "noopener noreferrer";
        li.appendChild(a);
      } else {
        li.appendChild(el("span", "mono", of.filename));
      }
      li.appendChild(el("span", "of-counts",
        "  +" + (of.additions || 0) + " -" + (of.deletions || 0)));
      ul.appendChild(li);
    });
    box.appendChild(ul);
    root.appendChild(box);
  }

  // ---- existing GitHub activity: rendering ----
  // Every string below reaches the DOM through el()/textContent. These bodies are
  // written by anyone with access to the PR, so innerHTML here would be a stored
  // XSS sink, and none of this content is ever treated as an instruction.

  // Defence in depth against a hand-built page: existing_activity.py already
  // allowlists the URL's host, so the job left here is rejecting non-https
  // schemes (javascript:, data:) before anything reaches an href.
  function ghSafeUrl(url) {
    return (typeof url === "string" && url.indexOf("https://") === 0) ? url : null;
  }

  function ghLink(url, label) {
    var wrap = el("div", "gh-link");
    var safe = ghSafeUrl(url);
    if (!safe) return wrap;
    var a = document.createElement("a");
    a.href = safe;
    a.textContent = label;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    wrap.appendChild(a);
    return wrap;
  }

  // ---- overlap between AI findings and existing threads ----
  // SURFACING ONLY, never suppression. The finding is still seeded, still rendered,
  // and still submittable; all this adds is the fact that a thread already covers
  // these lines, so the reviewer triages with that in view instead of discovering
  // the duplicate after posting. Letting an existing comment cancel a finding the
  // diff supports would hand suppression to anyone who can comment on the PR, which
  // is the failure SKILL.md "The PR itself is third-party content" exists to stop.
  //
  // Computed on the fly, never stored: nothing here touches the annotation object,
  // saveDraft(), stripInternal(), or buildPayload(), so it cannot reach localStorage
  // or a GitHub payload.
  //
  // Matching uses CURRENT lines only. An outdated thread has no current line (the
  // originalLine rule in annotation-schema.md §2a), so it cannot honestly be
  // positioned against a finding and is deliberately not matched; it stays visible
  // in the activity panel instead.
  function threadCurrentRange(t) {
    if (t.line == null) return null;
    var lo = (t.startLine != null && t.startLine < t.line) ? t.startLine : t.line;
    return { lo: lo, hi: t.line };
  }

  function overlappingThreads(a) {
    if (!activity || a.filePath == null || a.scope === "general") return [];
    return activityList("threads").filter(function (t) {
      if (t.filePath !== a.filePath) return false;
      // A file-level finding pairs with a file-level thread; a line finding pairs
      // with a line thread. Crossing the two produces a claim neither supports
      // ("discusses these lines" about a whole-file note), so it is left out.
      if (a.scope === "file") return t.subjectType === "FILE";
      if (a.scope !== "line" || a.lineStart == null) return false;
      if (t.subjectType === "FILE" || t.side !== a.side) return false;
      var range = threadCurrentRange(t);
      if (!range) return false;
      var lo = Math.min(a.lineStart, a.lineEnd);
      var hi = Math.max(a.lineStart, a.lineEnd);
      return range.lo <= hi && lo <= range.hi;
    });
  }

  function overlapAuthors(threads) {
    var authors = [];
    threads.forEach(function (t) {
      (t.comments || []).forEach(function (c) {
        if (c.author && authors.indexOf(c.author) === -1) authors.push(c.author);
      });
    });
    return authors;
  }

  function buildOverlapNote(a, threads) {
    var wrap = el("div", "anno-overlap");
    wrap.appendChild(el("span", "anno-overlap-badge", "Already discussed"));

    var open = 0;
    var resolved = 0;
    threads.forEach(function (t) { if (t.isResolved) resolved++; else open++; });
    var bits = [];
    if (open) bits.push(open + (open === 1 ? " open thread" : " open threads"));
    if (resolved) bits.push(resolved + (resolved === 1 ? " resolved thread" : " resolved threads"));

    var text = bits.join(" and ") +
      (a.scope === "file" ? " on this file" : " on these lines");
    var authors = overlapAuthors(threads);
    if (authors.length) {
      text += " (" + authors.slice(0, 3).join(", ") +
        (authors.length > 3 ? ", +" + (authors.length - 3) + " more" : "") + ")";
    }
    text += ". Read it before you decide - this finding is still yours to accept or discard.";
    wrap.appendChild(el("span", "anno-overlap-text", text));

    if (threads[0] && threads[0].url) {
      wrap.appendChild(ghLink(threads[0].url, "Open the thread"));
    }
    return wrap;
  }

  function ghWhereLabel(t) {
    var path = t.filePath || "(unknown file)";
    if (t.subjectType === "FILE") return path + " : file-level";
    if (t.line != null) {
      var range = (t.startLine != null && t.startLine !== t.line)
        ? t.startLine + "-" + t.line : String(t.line);
      return path + " : line " + range + (t.side ? " (" + t.side + ")" : "");
    }
    if (t.originalLine != null) return path + " : was line " + t.originalLine;
    return path;
  }

  function buildGhComment(c) {
    var msg = el("div", "gh-msg");
    var who = el("div", "gh-who");
    who.appendChild(el("span", "gh-author", c.author || "unknown user"));
    if (c.createdAt) who.appendChild(el("span", null, c.createdAt));
    if (c.authorAssociation) {
      who.appendChild(el("span", "chip gh-state", String(c.authorAssociation).toLowerCase()));
    }
    msg.appendChild(who);
    msg.appendChild(el("div", "gh-body", c.body || ""));
    if (c.bodyTruncated) {
      msg.appendChild(el("div", "gh-note", "This comment was shortened to fit."));
    }
    if (c.url) msg.appendChild(ghLink(c.url, "View on GitHub"));
    return msg;
  }

  function buildGhThreadNode(t, opts) {
    opts = opts || {};
    var cls = "gh-thread";
    if (t.isResolved) cls += " resolved";
    if (t.isOutdated) cls += " outdated";
    var wrap = el("details", cls);
    // Resolved threads start collapsed. An unresolved thread stays OPEN even when
    // it is outdated: "the code moved" is not "somebody handled this", and
    // collapsing it by default would hide still-open feedback.
    if (!t.isResolved) wrap.open = true;

    var summary = el("summary", "gh-summary");
    summary.appendChild(el("span", "badge badge-gh", "Existing on GitHub"));
    if (t.isResolved) {
      summary.appendChild(el("span", "chip gh-resolved",
        t.resolvedBy ? "resolved by " + t.resolvedBy : "resolved"));
    } else {
      summary.appendChild(el("span", "chip gh-open", "unresolved"));
    }
    if (t.isOutdated) summary.appendChild(el("span", "chip gh-outdated", "outdated"));
    if (opts.showWhere) summary.appendChild(el("span", "gh-where", ghWhereLabel(t)));
    var count = (t.comments || []).length;
    summary.appendChild(el("span", "gh-count",
      count + (count === 1 ? " comment" : " comments")));
    wrap.appendChild(summary);

    var body = el("div", "gh-thread-body");
    (t.comments || []).forEach(function (c) { body.appendChild(buildGhComment(c)); });
    if (t.commentsOmitted) {
      body.appendChild(el("div", "gh-note", t.commentsOmitted +
        (t.commentsOmitted === 1 ? " earlier reply is" : " earlier replies are") +
        " not shown here. Open the thread on GitHub to read them."));
    }
    if (t.isOutdated) {
      body.appendChild(el("div", "gh-note",
        "The code this thread pointed at has changed, so it is not shown next to " +
        "the diff." + (t.originalLine != null
          ? " It was on line " + t.originalLine + "." : "")));
    }
    wrap.appendChild(body);
    return wrap;
  }

  // Anchorable threads render under the line they are about. Anything that cannot
  // be placed is returned so the panel can show it: an existing comment must never
  // silently vanish just because the diff moved underneath it.
  function renderExistingThreadsInline() {
    Array.prototype.forEach.call(
      document.querySelectorAll(".gh-thread-list > .gh-thread"),
      function (n) { n.remove(); });
    var unplaced = [];
    activityList("threads").forEach(function (t) {
      if (!threadIsInlineable(t)) { unplaced.push(t); return; }
      var row = findDiffRow(t.filePath, t.side, t.line);
      if (!row) { unplaced.push(t); return; }
      var host = ensureRowHost(row, "gh-thread-list", "gh-anchor",
        anchorKey(t.filePath, t.side, t.line));
      host.appendChild(buildGhThreadNode(t, { showWhere: false }));
    });
    Array.prototype.forEach.call(document.querySelectorAll(".gh-thread-list"),
      function (h) { if (!h.childElementCount) h.remove(); });
    return unplaced;
  }

  function ghReviewNode(r) {
    var node = el("div", "gh-review");
    var who = el("div", "gh-who");
    who.appendChild(el("span", "gh-author", r.author || "unknown user"));
    if (r.state) {
      who.appendChild(el("span", "chip gh-state",
        String(r.state).toLowerCase().replace(/_/g, " ")));
    }
    if (r.submittedAt) who.appendChild(el("span", null, r.submittedAt));
    node.appendChild(who);
    if (r.body) node.appendChild(el("div", "gh-body", r.body));
    if (r.url) node.appendChild(ghLink(r.url, "View on GitHub"));
    return node;
  }

  function ghSection(title, nodes) {
    if (!nodes.length) return null;
    var section = el("div", "gh-section");
    section.appendChild(el("h4", null, title));
    nodes.forEach(function (n) { section.appendChild(n); });
    return section;
  }

  function renderExistingActivity() {
    var root = document.getElementById("activity");
    if (!root) return;
    clearNode(root);
    // Local-branch mode has no PR, so there is nothing to read. `activity` is also
    // null on a page built before this feature existed, which must keep working.
    if (!activity || DATA.mode !== "pr") return;

    var unplaced = renderExistingThreadsInline();
    var threads = activityList("threads");
    var reviews = activityList("reviews");
    var issues = activityList("issueComments");
    var inlineCount = threads.length - unplaced.length;
    var truncation = activity.truncation || {};
    var omitted = (truncation.threadsOmitted || 0) + (truncation.commentsOmitted || 0) +
      (truncation.reviewsOmitted || 0) + (truncation.issueCommentsOmitted || 0);
    var hasContent = threads.length || reviews.length || issues.length;

    if (!hasContent && activity.status === "complete") {
      root.appendChild(el("p", "gh-empty",
        "No previous review activity on this PR."));
      return;
    }

    var panel = el("section", "panel gh-panel");
    panel.id = "activity-panel";
    var head = el("div", "panel-head");
    head.appendChild(el("span", null, "Previous review activity on GitHub"));
    var parts = [];
    if (reviews.length) parts.push(reviews.length + (reviews.length === 1 ? " review" : " reviews"));
    if (threads.length) parts.push(threads.length + (threads.length === 1 ? " thread" : " threads"));
    if (issues.length) parts.push(issues.length + (issues.length === 1 ? " comment" : " comments"));
    if (parts.length) head.appendChild(el("span", "gh-sub", parts.join(" · ")));
    var toggle = el("span", "toggle", "▾ collapse");
    head.appendChild(toggle);
    head.addEventListener("click", function () {
      panel.classList.toggle("collapsed");
      toggle.textContent = panel.classList.contains("collapsed")
        ? "▸ expand" : "▾ collapse";
    });
    panel.appendChild(head);

    var body = el("div", "panel-body");

    if (activity.status === "unavailable") {
      body.appendChild(el("div", "gh-unavailable",
        "Could not read this PR's existing review activity" +
        (activity.reason ? ": " + activity.reason : "") +
        ". Previous comments may exist that are not shown here."));
    } else if (activity.status === "partial") {
      body.appendChild(el("div", "gh-warn",
        "Only part of this PR's review activity could be read" +
        (activity.reason ? ": " + activity.reason : "") +
        ". Treat this list as incomplete."));
    }
    if (omitted) {
      body.appendChild(el("div", "gh-warn",
        "This PR has more activity than fits on one page, so " + omitted +
        " item(s) were left out. Unresolved threads were kept first."));
    }

    var snapshot = "Read from GitHub" +
      (activity.fetchedAt ? " at " + activity.fetchedAt : "") +
      ". This is a snapshot and does not update while the page is open.";
    body.appendChild(el("div", "gh-note", snapshot));

    if (inlineCount > 0) {
      body.appendChild(el("div", "gh-note", inlineCount +
        (inlineCount === 1 ? " thread is" : " threads are") +
        " shown inline, next to the lines they are about."));
    }

    var sections = [
      ghSection("Reviews", reviews.map(ghReviewNode)),
      ghSection("Threads not shown inline", unplaced.map(function (t) {
        return buildGhThreadNode(t, { showWhere: true });
      })),
      ghSection("PR conversation", issues.map(function (c) {
        var node = el("div", "gh-review");
        node.appendChild(buildGhComment(c));
        return node;
      }))
    ];
    sections.forEach(function (s) { if (s) body.appendChild(s); });

    panel.appendChild(body);
    root.appendChild(panel);
  }

  // The one place triage state is counted. The sidebar, the top-bar progress and
  // the footer all read this single snapshot, so a per-file count can never
  // disagree with the totals - which is the whole point of computing it once.
  //
  // "Decided" means accepted OR discarded. Discarding is a decision, so it has to
  // count as progress; the footer's separate "N of M accepted" figure deliberately
  // measures something else and is left alone.
  function triage() {
    var t = { total: 0, decided: 0, undecided: 0, blocking: 0, byFile: {} };
    aiAnnotations.forEach(function (a) {
      var key = a.filePath == null ? "" : a.filePath;
      var slot = t.byFile[key] || (t.byFile[key] = { total: 0, decided: 0, undecided: 0, blocking: 0 });
      var isDecided = a.accepted === true || a._discarded === true;
      t.total++; slot.total++;
      if (isDecided) { t.decided++; slot.decided++; }
      else {
        t.undecided++; slot.undecided++;
        if (a.severity === "blocking") { t.blocking++; slot.blocking++; }
      }
    });
    return t;
  }

  function renderProgress(t) {
    var wrap = document.getElementById("progress");
    if (!t.total) { wrap.hidden = true; }
    else {
      wrap.hidden = false;
      document.getElementById("progress-text").textContent =
        t.decided + " of " + t.total + (t.total === 1 ? " draft decided" : " drafts decided");
      document.getElementById("progress-fill").style.width =
        Math.round((t.decided / t.total) * 100) + "%";
    }
    // Re-measure: showing or hiding this block changes the bar's height whenever
    // the bar wraps, which it does on narrow viewports. renderShell() measured it
    // before this ran, so without this the sticky offset and .anno scroll-margin
    // stay one wrapped row too short and focused findings land under the bar.
    syncTopbarHeight();
  }

  function syncTocCounts(t) {
    Array.prototype.forEach.call(document.querySelectorAll("#toc a[data-toc-file]"), function (a) {
      var slot = t.byFile[a.dataset.tocFile];
      var count = a.querySelector(".toc-count");
      var left = slot ? slot.undecided : 0;
      // A file with nothing left to decide says so with a tick rather than a zero,
      // so "done" and "never had any" do not look the same.
      count.textContent = left ? String(left) : (slot && slot.total ? "\u2713" : "");
      count.className = "toc-count" +
        (left && slot.blocking ? " has-blocking" : left ? " has-drafts" : "");
      a.classList.toggle("is-empty", !left);
    });
  }

  function renderCounts() {
    var t = triage();
    renderProgress(t);
    syncTocCounts(t);
    applyFilters();

    var userCount = userAnnotations.length;
    var aiTotal = aiAnnotations.filter(function (a) { return !a._discarded; }).length;
    var aiAccepted = aiAnnotations.filter(function (a) { return a.accepted && !a._discarded; }).length;
    var warnings = countUnanchored();
    document.getElementById("c-user").textContent = String(userCount);
    document.getElementById("c-ai").textContent = aiAccepted + " of " + aiTotal;
    document.getElementById("c-warn").textContent = String(warnings);

    // Live, because discarding a draft changes it. Hidden entirely at zero so a PR
    // with no prior discussion gets the footer it had before this feature.
    var overlapping = aiAnnotations.filter(function (a) {
      return !a._discarded && overlappingThreads(a).length;
    }).length;
    document.getElementById("c-overlap").textContent = String(overlapping);
    document.getElementById("c-overlap-wrap").hidden = !overlapping;
  }

  function countUnanchored() {
    var all = userAnnotations.concat(aiAnnotations.filter(function (a) { return !a._discarded; }));
    var n = 0;
    all.forEach(function (a) {
      if (a.scope !== "line" || a.filePath == null) return;
      if (!findDiffRow(a.filePath, a.side, a.lineEnd)) n++;
    });
    return n;
  }

  function buildPayload() {
    // Every annotation in current state: user-authored + AI drafts (accepted flag
    // reflects triage). Discarded AI drafts are excluded entirely. Filtering to
    // accepted:true happens downstream in build_review.py, not here.
    var annotations = [];
    userAnnotations.forEach(function (a) { annotations.push(stripInternal(a)); });
    aiAnnotations.forEach(function (a) { if (!a._discarded) annotations.push(stripInternal(a)); });
    var payload = {
      kind: "review-annotations",
      mode: DATA.mode,
      repo: DATA.repo != null ? DATA.repo : null,
      prNumber: DATA.prNumber != null ? DATA.prNumber : null,
      branch: DATA.branch,
      generalComment: generalComment,
      annotations: annotations
    };
    // Both extras are Q&A-only, so a page without the live Q&A channel (fallback,
    // or a server started without --session-dir) produces byte-identical output to
    // before: no nonce, no transcript key.
    if (qaEnabled) {
      payload.nonce = sessionNonce;   // §5.2: /submit is nonce-checked in Q&A mode
      if (qaQuestions.length) payload.transcript = buildTranscript();
    }
    return payload;
  }

  function stripInternal(a) {
    var out = {
      id: a.id, scope: a.scope, type: a.type, filePath: a.filePath,
      lineStart: a.lineStart != null ? a.lineStart : null,
      lineEnd: a.lineEnd != null ? a.lineEnd : null,
      side: a.side != null ? a.side : null,
      body: a.body || "", origin: a.origin, accepted: a.accepted === true
    };
    if (a.type === "suggestion" && a.suggestedCode != null) out.suggestedCode = a.suggestedCode;
    if (a.origin === "ai") {
      if (a.severity != null) out.severity = a.severity;
      if (a.reasoning != null) out.reasoning = a.reasoning;
      if (a.disproof != null) out.disproof = a.disproof;
      if (a.background != null) out.background = a.background;
    }
    return out;
  }

  // Label for the AI falsification step (annotation-schema.md §1, `disproof`) in
  // rendered Markdown. Kept identical to DISPROOF_LABEL in scripts/build_review.py
  // so the local fix-list and a posted GitHub comment read the same way.
  var DISPROOF_LABEL = "**Smallest check that would prove this wrong:**";

  // Prefix for the AI `background` paragraph in the fix-list (annotation-schema.md
  // §4): plain text, immediately after the body and before any suggestion fence.
  var BACKGROUND_LABEL = "Background:";

  // Local-mode fix-list: the Markdown the agent would render from a submitted
  // payload, built client-side so the user can paste it somewhere directly
  // (chat, an issue, a scratch file) without a round-trip through the server.
  // Format is annotation-schema.md §4 verbatim, with ONE deliberate omission:
  // the mandatory handoff paragraph. That paragraph is the agent's guard against
  // "fixing" unconfirmed findings, so it belongs on the agent's printed copy of
  // the file; pasting it into a GitHub comment would only confuse the author.
  function buildFixlistMarkdown() {
    var today = new Date().toISOString().split("T")[0];
    var branch = DATA.branch || "unknown";

    // buildPayload() deliberately does NOT filter by acceptance (that happens
    // downstream in build_review.py), so the filter lives here instead:
    // both user annotations and AI drafts must have accepted === true;
    // AI drafts additionally must not be discarded.
    var accepted = [];
    userAnnotations.forEach(function (a) {
      if (a.accepted === true) accepted.push(a);
    });
    aiAnnotations.forEach(function (a) {
      if (a.accepted === true && !a._discarded) accepted.push(a);
    });

    var lines = [];
    lines.push("# Review fix-list: " + branch);
    lines.push("");
    lines.push("Generated " + today + ". Local branch review, nothing posted to GitHub.");
    lines.push("");

    var byFile = {};
    var fileOrder = [];
    accepted.forEach(function (a) {
      if (a.scope === "general") return;
      if (!a.filePath) return;
      if (!byFile[a.filePath]) { byFile[a.filePath] = []; fileOrder.push(a.filePath); }
      byFile[a.filePath].push(a);
    });

    fileOrder.forEach(function (fp) {
      lines.push("## " + fp);
      lines.push("");
      byFile[fp].forEach(function (a) {
        if (a.scope === "line" && a.lineStart != null) {
          var rangeStr = a.lineStart === a.lineEnd
            ? String(a.lineStart) : a.lineStart + "-" + a.lineEnd;
          var isSuggestion = a.type === "suggestion";
          lines.push("### Lines " + rangeStr + " (" + a.side + ")" +
            (isSuggestion ? ": suggestion" : ""));
          lines.push("");
          lines.push(a.body || "");
          lines.push("");
          if (a.origin === "ai" && a.background) {
            lines.push(BACKGROUND_LABEL + " " + a.background);
            lines.push("");
          }
          if (a.origin === "ai" && a.disproof) {
            lines.push(DISPROOF_LABEL + " " + a.disproof);
            lines.push("");
          }
          if (isSuggestion && a.suggestedCode != null) {
            lines.push("```suggestion");
            lines.push(a.suggestedCode);
            lines.push("```");
            lines.push("");
          }
        } else if (a.scope === "file") {
          lines.push("### File-level");
          lines.push("");
          lines.push(a.body || "");
          lines.push("");
          if (a.origin === "ai" && a.background) {
            lines.push(BACKGROUND_LABEL + " " + a.background);
            lines.push("");
          }
          if (a.origin === "ai" && a.disproof) {
            lines.push(DISPROOF_LABEL + " " + a.disproof);
            lines.push("");
          }
        }
      });
    });

    var generalAnnotations = accepted.filter(function (a) { return a.scope === "general"; });
    var hasGeneral = generalAnnotations.length > 0 || !!(generalComment && generalComment.trim());
    if (hasGeneral) {
      lines.push("## General");
      lines.push("");
      generalAnnotations.forEach(function (a) { lines.push(a.body || ""); lines.push(""); });
      if (generalComment && generalComment.trim()) {
        lines.push(generalComment.trim());
        lines.push("");
      }
      lines.push("---");
      lines.push("");
    }

    return lines.join("\n");
  }

  // =====================================================================
  //  Live Q&A: ask the agent about a finding or a line range
  //  Protocol: references/annotation-schema.md §5. Every function below is
  //  dead code unless qaEnabled; nothing here runs, renders, or listens on a
  //  fallback (file://, no-server) page.
  //  Security: question and answer bodies are untrusted free text and are
  //  ALWAYS placed with el()/textContent. No raw-HTML-string DOM sink exists in this
  //  section, and no markdown/HTML rendering of answers (§5.8).
  // =====================================================================

  function clearNode(n) { while (n.firstChild) n.removeChild(n.firstChild); }

  function pendingQuestions() {
    return qaQuestions.filter(function (q) { return !q.answered; });
  }

  function canAsk() {
    return qaEnabled && qaState === "active" && pendingQuestions().length < MAX_PENDING;
  }

  function askBlockedReason() {
    if (qaState === "stale") return "This page belongs to an older review session.";
    if (qaState === "ended") return "The review session has ended.";
    if (pendingQuestions().length >= MAX_PENDING) {
      return "Waiting on " + MAX_PENDING + " questions already. Ask again once one is answered.";
    }
    return "";
  }

  // §5.3: qid is `<sessionNonce>-q<counter>`, counter starting at 1. The server
  // validates it with re.fullmatch(f"{nonce}-q[0-9]+", qid) and rejects anything
  // else with 400, so this format is a hard contract, not a convention.
  function nextQid() { qaCounter += 1; return sessionNonce + "-q" + qaCounter; }

  function makeQuestion(spec) {
    var q = {
      qid: nextQid(),
      nonce: sessionNonce,
      kind: spec.kind,
      target: spec.target,
      threadId: spec.threadId,
      parentQid: spec.parentQid != null ? spec.parentQid : null,
      body: spec.body || "",
      askedAt: new Date().toISOString(),
      askedAtMs: Date.now(),
      answer: null,
      answered: false
    };
    if (!q.threadId) q.threadId = q.qid;   // a top-level question starts its own thread
    return q;
  }

  function questionWire(q) {
    return {
      qid: q.qid, nonce: q.nonce, kind: q.kind, target: q.target,
      threadId: q.threadId, parentQid: q.parentQid, body: q.body, askedAt: q.askedAt
    };
  }

  // One POST, no auto-retry: callers surface the rejection with a single Retry
  // button so a dead server can never turn into a request loop.
  function postQuestion(q) {
    return fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(questionWire(q))
    }).then(
      function (res) {
        if (res.status === 409) {
          endQaSession("stale");
          throw new Error("Stale session: the server rejected this page's nonce.");
        }
        if (res.status === 413) {
          throw new Error("That question is too long (limit " + MAX_QUESTION_CHARS + " characters).");
        }
        if (!res.ok) throw new Error("The server rejected the question (HTTP " + res.status + ").");
        return true;
      },
      function () { throw new Error("Could not reach the review server."); }
    );
  }

  function registerQuestion(q) {
    qaQuestions.push(q);
    qaByQid[q.qid] = q;
    ensurePolling();
  }

  function showQaError(host, message, onRetry) {
    clearNode(host);
    var box = el("div", "qa-error");
    box.appendChild(el("span", null, message));
    if (onRetry) {
      var retry = el("button", "btn small", "Retry");
      retry.addEventListener("click", onRetry);
      box.appendChild(retry);
    }
    host.appendChild(box);
  }

  function closeQaComposer() {
    abortQaDictation();
    var open = document.querySelector(".qa-composer");
    if (open) open.remove();
  }

  // Shared by both speech directions. A region-carrying tag is preferred because a
  // bare primary subtag ("en") leaves the engine to guess a locale, while "en-US"
  // names one; navigator.language reflects the person, document lang only the page.
  function qaSpeechLang() {
    var tags = [];
    if (typeof navigator === "object" && navigator && typeof navigator.language === "string") {
      tags.push(navigator.language.trim());
    }
    var docLang = document.documentElement.lang;
    if (typeof docLang === "string") tags.push(docLang.trim());
    tags = tags.filter(function (t) { return !!t; }).map(function (t) { return t.replace(/_/g, "-"); });
    for (var i = 0; i < tags.length; i++) {
      if (tags[i].indexOf("-") > 0) return tags[i];
    }
    return tags.length ? tags[0] : "en-US";
  }

  // ---- push-to-talk dictation (Web Speech API) ----
  // Chrome/Edge/Safari only. When the constructor is missing (Firefox) no mic
  // affordance is created at all, so that composer is the one that shipped before
  // this feature existed. One recognizer, one live session; the composer that
  // started it owns qaDictation, and every teardown path clears that ownership so
  // a stray late event can never write into a removed textarea.
  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var qaRecognition = null;
  var qaDictating = false;
  var qaDictation = null;   // { onFinal, onFailure, onIdle } of the owning composer

  var QA_MIC_ERRORS = {
    "not-allowed": "Microphone permission was denied. Allow microphone access for this page, or type the question instead.",
    "service-not-allowed": "The browser blocked its speech service for this page. Allow microphone access, or type the question instead.",
    "no-speech": "No speech was detected. Press the mic and speak, or type the question instead.",
    "audio-capture": "No microphone was found. Connect one, or type the question instead.",
    // Chromium collapses every speech-backend failure onto this one code, including
    // "this build ships the API with no service behind it", so it cannot be reported
    // as a connectivity problem: that misdirects everyone on a fork without a backend.
    "network": "Speech recognition is unavailable in this browser. This usually means the browser ships the API without a working speech service rather than a problem with your microphone or connection - Chrome, Edge and Safari normally work. Type the question instead.",
    "aborted": "Dictation stopped before anything was transcribed."
  };

  function qaMicErrorMessage(code) {
    if (code && QA_MIC_ERRORS[code]) return QA_MIC_ERRORS[code];
    return "Dictation failed (" + (code || "unknown error") + "). Type the question instead.";
  }

  function ensureQaRecognition() {
    if (qaRecognition) return qaRecognition;
    var r = new SpeechRecognitionCtor();
    r.lang = qaSpeechLang();
    r.interimResults = false;   // final transcripts only: the reviewer edits text, not a stream
    r.continuous = false;       // push-to-talk, never an open conversation channel
    r.onresult = function (ev) {
      var session = qaDictation;
      if (!session || !ev || !ev.results) return;
      var text = "";
      for (var i = ev.resultIndex || 0; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) text += ev.results[i][0].transcript;
      }
      text = text.trim();
      if (text) session.onFinal(text);
    };
    r.onerror = function (ev) {
      var session = qaDictation;
      if (session) session.onFailure(qaMicErrorMessage(ev && ev.error));
    };
    r.onend = function () {
      qaDictating = false;
      if (qaDictation) qaDictation.onIdle();
    };
    qaRecognition = r;
    return r;
  }

  function stopQaDictation() {
    if (!qaRecognition || !qaDictating) return;
    try { qaRecognition.stop(); } catch (e) {}   // onend returns the button to idle
  }

  // Called on every composer teardown path. Guarded and idempotent: without it a
  // removed composer would leave the browser's recording indicator lit.
  function abortQaDictation() {
    var session = qaDictation;
    qaDictation = null;
    if (qaRecognition && qaDictating) {
      qaDictating = false;
      try { qaRecognition.abort(); } catch (e) {}
    }
    if (session) session.onIdle();
  }

  function openQaComposer(opts) {
    closeQaComposer();
    var c = el("div", "qa-composer");
    c.appendChild(el("div", "qa-composer-label", opts.label));

    var ta = document.createElement("textarea");
    ta.maxLength = MAX_QUESTION_CHARS;   // client-side half of the §5.6 cap
    ta.placeholder = "What would you like the agent to look into?";
    c.appendChild(ta);

    var count = el("div", "qa-count", "0 / " + MAX_QUESTION_CHARS);
    ta.addEventListener("input", function () {
      count.textContent = ta.value.length + " / " + MAX_QUESTION_CHARS;
    });
    c.appendChild(count);

    // Carried over from a composer the reviewer had already typed into, so the text
    // survives the switch of destination instead of being thrown away with the box it
    // was typed in. Cap and counter are applied by hand for the same reason
    // appendTranscript() does it: assigning .value fires no "input" and ignores
    // maxLength. Note what is NOT carried: `dictated` stays false, because text that
    // was typed did not come from the microphone.
    if (typeof opts.seedText === "string" && opts.seedText) {
      ta.value = opts.seedText.slice(0, MAX_QUESTION_CHARS);
      count.textContent = ta.value.length + " / " + MAX_QUESTION_CHARS;
    }

    var actions = el("div", "actions");
    var sendBtn = el("button", "btn primary small", "Send question");
    var cancelBtn = el("button", "btn small", "Cancel");
    actions.appendChild(sendBtn); actions.appendChild(cancelBtn);
    c.appendChild(actions);

    var status = el("div", "qa-status");
    c.appendChild(status);

    var micBtn = null;
    var dictated = false;   // any part of this question came from speech
    if (SpeechRecognitionCtor) {
      micBtn = el("button", "btn small qa-mic-btn", "🎤 Dictate");
      micBtn.type = "button";
      micBtn.title = "Dictate the question, then edit it before sending";
      actions.insertBefore(micBtn, cancelBtn);

      var recording = false;
      var setRecording = function (on) {
        recording = on;
        if (on) micBtn.classList.add("recording"); else micBtn.classList.remove("recording");
        micBtn.textContent = on ? "🎤 Stop" : "🎤 Dictate";
      };
      var appendTranscript = function (text) {
        dictated = true;
        var base = ta.value.replace(/\s+$/, "");
        var merged = base ? base + " " + text : text;
        // Programmatic assignment neither fires "input" nor honours maxLength, so the
        // §5.6 cap and the counter are both applied by hand here.
        ta.value = merged.slice(0, MAX_QUESTION_CHARS);
        count.textContent = ta.value.length + " / " + MAX_QUESTION_CHARS;
        ta.focus();
      };
      micBtn.addEventListener("click", function () {
        if (recording) { stopQaDictation(); return; }
        clearNode(status);
        var r = ensureQaRecognition();
        qaDictation = {
          onFinal: appendTranscript,
          onFailure: function (message) {
            clearNode(status);
            status.appendChild(el("div", "qa-notice", message));
          },
          onIdle: function () { setRecording(false); }
        };
        try {
          r.start();
        } catch (e) {
          // InvalidStateError: the previous session has not finished winding down.
          qaDictation = null;
          status.appendChild(el("div", "qa-notice", "Dictation is still starting. Try again in a moment."));
          return;
        }
        qaDictating = true;
        setRecording(true);
      });
    }

    cancelBtn.addEventListener("click", function () {
      abortQaDictation();
      c.remove();
      if (opts.afterClose) opts.afterClose();
    });

    function attempt(q) {
      sendBtn.disabled = true; cancelBtn.disabled = true;
      if (micBtn) micBtn.disabled = true;
      abortQaDictation();   // the send is committed; nothing may still be listening
      clearNode(status);
      status.appendChild(el("div", "qa-pending", "Sending…"));
      postQuestion(q).then(function () {
        c.remove();
        registerQuestion(q);
        renderQa();
      }).catch(function (err) {
        sendBtn.disabled = false; cancelBtn.disabled = false;
        if (micBtn) micBtn.disabled = false;
        showQaError(status, err.message, function () { attempt(q); });
      });
    }

    sendBtn.addEventListener("click", function () {
      var body = ta.value.trim();
      if (!body) { ta.focus(); return; }
      if (body.length > MAX_QUESTION_CHARS) body = body.slice(0, MAX_QUESTION_CHARS);
      if (!canAsk()) { showQaError(status, askBlockedReason(), null); return; }
      var q = makeQuestion({
        kind: "question", target: opts.target,
        threadId: opts.threadId, parentQid: opts.parentQid, body: body
      });
      if (dictated) voiceQids.add(q.qid);
      attempt(q);
    });

    if (opts.insertBefore && opts.container) {
      opts.container.insertBefore(c, opts.insertBefore);
    } else {
      opts.container.appendChild(c);
    }
    ta.focus();
    // focus() alone parks the caret in front of seeded text; the next keystroke
    // belongs after it. Guarded because setSelectionRange throws on a detached node.
    if (ta.value) {
      try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {}
    }
    return c;
  }

  // §5.3 background-request: same channel, empty body, annotation target.
  function requestBackground(a, btn, card) {
    if (!canAsk()) return;
    var q = makeQuestion({
      kind: "background-request",
      target: { type: "annotation", annotationId: a.id },
      threadId: null, parentQid: null, body: ""
    });
    var status = el("div", "qa-status");
    card.appendChild(status);
    btn.disabled = true;
    var original = btn.textContent;
    btn.textContent = "Requesting…";
    postQuestion(q).then(function () {
      status.remove();
      registerQuestion(q);
      renderQa();
    }).catch(function (err) {
      btn.disabled = false;
      btn.textContent = original;
      showQaError(status, err.message, function () {
        status.remove();
        requestBackground(a, btn, card);
      });
    });
  }

  // ---- thread rendering (all text via el()/textContent) ----

  function threadIdsOf(list) {
    var seen = {}, order = [];
    list.forEach(function (q) {
      if (!seen[q.threadId]) { seen[q.threadId] = true; order.push(q.threadId); }
    });
    return order;
  }

  function formatElapsed(ms) {
    var secs = Math.max(0, Math.round(ms / 1000));
    if (secs < 60) return secs + "s";
    return Math.floor(secs / 60) + "m " + (secs % 60) + "s";
  }

  function targetLabel(t) {
    if (!t) return "";
    if (t.type === "lines") {
      var range = t.lineStart === t.lineEnd ? String(t.lineStart) : t.lineStart + "-" + t.lineEnd;
      return t.filePath + " : line " + range + " (" + t.side + ")";
    }
    return "finding " + t.annotationId;
  }

  // ---- speaking answers (speechSynthesis) ----

  // MDN caps one utterance at 32,767 chars, and Chrome can stall on a long one after
  // ~15s, so answers are split into chunks and chained.
  var SPEECH_CHUNK_CHARS = 2000;

  // Deliberately not a markdown parser: the only goal is to keep the two things that
  // are actively hostile to listen to - code blocks and URLs - out of the audio, and
  // to hand back pieces small enough to survive the chunk cap. Prose is spoken as
  // written; the rendered text path is untouched.
  function toSpeechText(body) {
    if (typeof body !== "string") return [];
    var text = body
      .replace(/```[\s\S]*?```/g, " ")     // fenced code blocks
      .replace(/```[\s\S]*$/, " ")         // an unclosed fence: drop its tail too
      .replace(/`+/g, " ")                 // inline backticks
      .replace(/\bhttps?:\/\/\S+/gi, " ")  // URLs, unreadable when spelled out loud
      .replace(/\bwww\.\S+/gi, " ")
      .replace(/\s+/g, " ")
      .trim();
    if (!text) return [];
    var chunks = [];
    var current = "";
    (text.match(/[^.!?]+[.!?]*\s*/g) || [text]).forEach(function (raw) {
      var piece = raw.trim();
      if (!piece) return;
      if (!current) current = piece;
      else if (current.length + 1 + piece.length <= SPEECH_CHUNK_CHARS) current += " " + piece;
      else { chunks.push(current); current = piece; }
    });
    if (current) chunks.push(current);
    // One sentence longer than the cap still has to break somewhere: at a space.
    var out = [];
    chunks.forEach(function (chunk) {
      while (chunk.length > SPEECH_CHUNK_CHARS) {
        var cut = chunk.lastIndexOf(" ", SPEECH_CHUNK_CHARS);
        if (cut <= 0) cut = SPEECH_CHUNK_CHARS;
        out.push(chunk.slice(0, cut));
        chunk = chunk.slice(cut).replace(/^\s+/, "");
      }
      if (chunk) out.push(chunk);
    });
    return out;
  }

  // macOS installs these as ordinary English voices and a "first voice whose lang
  // matches" heuristic picks them cheerfully. They are novelty effects, not speech.
  var SPEECH_NOVELTY_VOICES = /\b(?:zarvox|bubbles|bad news|good news|boing|cellos|jester|organ|trinoids|wobble|whisper|albert|fred|deranged|hysterical|bahh|bells|superstar|junior|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley|kathy|ralph)\b/i;
  // The only reliable signal for "this one does not sound like 1994" is the name.
  var SPEECH_QUALITY_VOICES = /premium|enhanced|natural|neural/i;

  function normalizeLangTag(tag) {
    return typeof tag === "string" ? tag.replace(/_/g, "-").toLowerCase() : "";
  }

  // Picks the least robotic voice the browser will admit to having, or null to leave
  // utterance.voice unset (i.e. exactly the pre-existing behaviour). Deliberately not
  // user-configurable: there is no voice picker, this is the whole decision.
  function qaPickVoice(voices, wantedLang) {
    if (!voices || !voices.length) return null;
    var wanted = normalizeLangTag(wantedLang) || "en-us";
    var wantedPrimary = wanted.split("-")[0];
    var best = null;
    var bestScore = 0;
    for (var i = 0; i < voices.length; i++) {
      var v = voices[i];
      if (!v || typeof v.name !== "string" || !v.name) continue;
      if (SPEECH_NOVELTY_VOICES.test(v.name)) continue;
      var lang = normalizeLangTag(v.lang);
      var score;
      if (lang && lang === wanted) score = 100;                                  // same locale
      else if (wantedPrimary && lang.split("-")[0] === wantedPrimary) score = 40; // same language
      else continue;                                     // another language: never spoken
      // A name-based quality guess must not outrank an actual locale match.
      if (SPEECH_QUALITY_VOICES.test(v.name)) score += 20;
      // Chrome's network voices; this page is an offline-capable local tool, so a
      // remote synthesiser is a dependency it should not acquire for read-aloud.
      if (v.localService === false) score -= 30;
      if (v.default) score += 1;   // Safari reports it for everything: tie-break only
      // Strictly greater, so equal scores keep the earlier voice: stable by index.
      if (!best || score > bestScore) { best = v; bestScore = score; }
    }
    return best;
  }

  // Resolved lazily, never at load: getVoices() is empty until the engine has built
  // its list. An empty list is not cached, so a later utterance can still find one.
  function pickedSpeechVoice(lang) {
    if (speechVoicePicked) return speechVoice;
    var synth = window.speechSynthesis;
    // The API is feature-detected per call, not captured: getVoices() is absent on
    // stand-ins for speechSynthesis and reading it blindly would throw.
    if (!synth || typeof synth.getVoices !== "function") return null;
    var voices;
    try { voices = synth.getVoices(); } catch (e) { return null; }
    if (!voices || !voices.length) return null;
    speechVoice = qaPickVoice(voices, lang);
    speechVoicePicked = true;
    return speechVoice;
  }

  // voiceschanged only drops the cache; nothing is re-spoken and no queue is touched.
  function bindSpeechVoiceRefresh() {
    if (speechVoiceBound) return;
    var synth = window.speechSynthesis;
    if (!synth || typeof synth.addEventListener !== "function") return;
    speechVoiceBound = true;
    try {
      synth.addEventListener("voiceschanged", function () {
        speechVoice = null;
        speechVoicePicked = false;
      });
    } catch (e) { /* best effort: a stale pick is still better than a throw */ }
  }

  function speechSupported() {
    return !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
  }

  // Every path that silences the page comes through here - the pill, Esc, a second
  // click on a playing answer, endQaSession(), pagehide - so releasing ownership and
  // repainting the controls belongs here too, before the early return: a browser with
  // no speechSynthesis at all still has to leave the labels in their idle state.
  function stopSpeaking() {
    speechQueue.length = 0;
    speechUtterance = null;
    speechSpeaking = false;
    speechOwnerQid = null;
    speechRun += 1;   // whatever the cancelled utterance fires next is now stale
    syncReadAloudButtons();
    renderSpeechStopPill();
    if (!window.speechSynthesis) return;
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }

  // The one control that is not anchored to any answer. It replaces the stop button
  // that used to render into qaStatusHost under the mode banner: that host is the top
  // of a page which is mostly diff, so audio started from a line far down had no
  // reachable off switch. Created on demand and removed on the way out rather than
  // hidden, so a browser without speechSynthesis never holds a dead control.
  var speechStopPill = null;

  function renderSpeechStopPill() {
    if (!(speechSpeaking && speechSupported())) {
      if (speechStopPill) { speechStopPill.remove(); speechStopPill = null; }
      return;
    }
    if (speechStopPill) return;
    speechStopPill = el("button", "btn small qa-stop-speaking-btn", "⏹ Stop speaking");
    speechStopPill.type = "button";
    speechStopPill.title = "Stop reading aloud (Esc)";
    speechStopPill.addEventListener("click", function () {
      stopSpeaking();
      renderQaStatus();
    });
    document.body.appendChild(speechStopPill);
  }

  // A toggle's label is a function of speechOwnerQid, computed here and nowhere else.
  // dataset.qid is the button's only durable identity; anything remembered on the
  // element is gone the next time renderQa() rebuilds the thread.
  function applyReadAloudState(btn) {
    var qid = btn.dataset.qid;
    var mine = !!(speechSpeaking && qid && qid === speechOwnerQid);
    btn.textContent = mine ? "⏹ Stop" : "🔊 Read aloud";
    btn.title = mine ? "Stop reading this answer aloud" : "Read this answer aloud";
    btn.setAttribute("aria-pressed", mine ? "true" : "false");
  }

  // Patched in place on every speech transition. renderQaStatus() rebuilds only the
  // status block and would leave a stale "⏹ Stop" sitting on an answer that finished
  // a minute ago; a full renderQa() would fix the labels and destroy any composer the
  // reviewer is typing into, which is the worse trade.
  function syncReadAloudButtons() {
    Array.prototype.forEach.call(document.querySelectorAll(".qa-read-btn"), applyReadAloudState);
  }

  function speakNext() {
    if (!speechSupported()) { stopSpeaking(); return; }
    var text = speechQueue.shift();
    if (text == null) {
      speechSpeaking = false;
      speechUtterance = null;
      speechOwnerQid = null;
      renderQaStatus();   // the Stop control is state-derived: it goes away here
      syncReadAloudButtons();   // and so is the toggle, which that call does not touch
      return;
    }
    var run = speechRun;
    var u = new SpeechSynthesisUtterance(text);
    var lang = qaSpeechLang();
    u.lang = lang;   // a hint the engine can use even when no voice object is set
    bindSpeechVoiceRefresh();
    var voice = pickedSpeechVoice(lang);
    // Left unset when nothing suitable exists, which is the OS default: no regression.
    // Guarded because the setter is typed: a patched getVoices() (an extension, a
    // test stand-in) can hand back an object the IDL attribute refuses.
    if (voice) { try { u.voice = voice; } catch (e) {} }
    var advance = function () {
      if (run !== speechRun) return;   // cancelled: do not resume a dead queue
      speechUtterance = null;
      speakNext();
    };
    u.onend = advance;
    u.onerror = advance;
    speechUtterance = u;
    try {
      window.speechSynthesis.speak(u);
    } catch (e) {
      // Blocked (no user activation) or unavailable. Silent by design: the
      // read-aloud button is the guaranteed path.
      stopSpeaking();
    }
  }

  function enqueueSpeech(chunks, qid) {
    if (!speechSupported() || !chunks || !chunks.length) return;
    chunks.forEach(function (c) { speechQueue.push(c); });
    if (speechSpeaking) return;   // the running chain will pick these up in order
    speechSpeaking = true;
    // Only the enqueue that actually starts the queue claims it. When two answers land
    // in one poll tick the second joins a chain that is already talking, and moving
    // the token would put "⏹ Stop" on an answer nobody has heard a word of yet.
    speechOwnerQid = typeof qid === "string" ? qid : null;
    syncReadAloudButtons();
    renderSpeechStopPill();
    speakNext();
  }

  function buildQuestionNode(q) {
    var msg = el("div", "qa-msg qa-q");
    msg.appendChild(el("span", "qa-label", "You"));
    if (q.kind === "background-request") {
      msg.appendChild(el("div", "qa-text qa-muted", "Requested background for this finding."));
    } else {
      msg.appendChild(el("div", "qa-text", q.body));
    }
    return msg;
  }

  // The guaranteed route to audio. Auto-speak needs user activation and the browser
  // may refuse it; a click never is refused. On EVERY answer that has text, and absent
  // only where the API itself is - so no dead control ships to Firefox. An answer that
  // sanitizes down to nothing (all code) still gets the button: enqueueSpeech() no-ops
  // on an empty chunk list, so the click stops any current speech and says nothing,
  // which beats a button that is there on some answers and not others.
  function appendReadAloudButton(msg, body, qid) {
    if (!speechSupported()) return;
    var chunks = toSpeechText(body);
    var host = el("div", "qa-actions");
    var btn = el("button", "btn small qa-read-btn");
    btn.type = "button";
    if (typeof qid === "string" && qid) btn.dataset.qid = qid;
    // Label and aria-pressed come from state, not from a default: this node may well
    // be built by the very poll tick that started reading this answer aloud, in which
    // case it has to appear already showing "⏹ Stop".
    applyReadAloudState(btn);
    btn.addEventListener("click", function () {
      // Reading this answer already? Then the button means stop, and stopping is the
      // whole action - re-enqueueing here is what used to restart it from the top.
      // Any other answer still jumps the queue, so stopSpeaking() stays first.
      var mine = speechSpeaking && speechOwnerQid === qid;
      stopSpeaking();        // an explicit click jumps the queue
      if (!mine) enqueueSpeech(chunks, qid);
      renderQaStatus();      // surface the session line now, not on the next tick
    });
    host.appendChild(btn);
    msg.appendChild(host);
  }

  function buildAnswerNode(q) {
    var msg = el("div", "qa-msg qa-a");
    msg.appendChild(el("span", "qa-label", "Agent"));
    if (q.answer) {
      msg.appendChild(el("div", "qa-text", q.answer));
      appendReadAloudButton(msg, q.answer, q.qid);
    } else if (q.kind === "background-request") {
      msg.appendChild(el("div", "qa-text qa-muted", "Background added to this finding."));
    } else {
      msg.appendChild(el("div", "qa-text qa-muted", "(no answer text)"));
    }
    return msg;
  }

  function buildPendingNode(q) {
    var frag = document.createDocumentFragment();
    frag.appendChild(el("div", "qa-pending", "Waiting for the agent… " + formatElapsed(Date.now() - q.askedAtMs)));
    if (Date.now() - q.askedAtMs >= SLOW_ANSWER_MS) {
      frag.appendChild(el("div", "qa-notice",
        "No response yet - the agent may have stopped. You can still Submit or Download."));
    }
    return frag;
  }

  function buildThreadNode(threadId, list, opts) {
    var wrap = el("div", "qa-thread");
    wrap.dataset.threadId = threadId;
    if (opts && opts.showTarget) {
      var chainTarget = list.length ? list[0].target : null;
      wrap.appendChild(el("div", "qa-target", targetLabel(chainTarget)));
    }
    if (opts && opts.note) wrap.appendChild(el("div", "qa-note", opts.note));
    // Follow-ups open in the host, not inside this wrap: a re-render rebuilds every
    // wrap, and a composer parented to one would be destroyed mid-typing.
    var composerHost = (opts && opts.composerHost) ? opts.composerHost : wrap;
    var chain = list.filter(function (q) { return q.threadId === threadId; });
    chain.forEach(function (q, i) {
      wrap.appendChild(buildQuestionNode(q));
      if (q.answered) {
        wrap.appendChild(buildAnswerNode(q));
        if (i === chain.length - 1) {
          var followBtn = el("button", "btn small qa-followup-btn", "Follow up");
          var host = el("div", "qa-actions");
          followBtn.addEventListener("click", function () {
            openQaComposer({
              target: q.target, threadId: threadId, parentQid: q.qid,
              container: composerHost, label: "Follow up on this thread",
              afterClose: function () { renderQa(); }
            });
          });
          host.appendChild(followBtn);
          wrap.appendChild(host);
        }
      } else {
        wrap.appendChild(buildPendingNode(q));
      }
    });
    return wrap;
  }

  function renderAnnotationThreads() {
    Array.prototype.forEach.call(document.querySelectorAll(".anno .qa-thread"),
      function (n) { n.remove(); });
    if (!qaEnabled) return;
    var byAnno = {};
    qaQuestions.forEach(function (q) {
      if (!q.target || q.target.type !== "annotation") return;
      if (!byAnno[q.target.annotationId]) byAnno[q.target.annotationId] = [];
      byAnno[q.target.annotationId].push(q);
    });
    Object.keys(byAnno).forEach(function (annoId) {
      var card = document.querySelector('.anno[data-anno-id="' + cssEscape(annoId) + '"]');
      if (!card) return;
      var list = byAnno[annoId];
      // Keep an open composer last so a thread arriving mid-typing cannot jump over it.
      var openComposerNode = card.querySelector(".qa-composer");
      threadIdsOf(list).forEach(function (tid) {
        var node = buildThreadNode(tid, list, { showTarget: false });
        if (openComposerNode) card.insertBefore(node, openComposerNode);
        else card.appendChild(node);
      });
    });
  }

  // The one line that keeps an inline thread from reading like a review comment.
  // The dashed grey vocabulary carries most of it; this says it out loud.
  var QA_INLINE_NOTE = "question to the agent · not part of your review";

  function lineQuestions() {
    return qaQuestions.filter(function (q) { return q.target && q.target.type === "lines"; });
  }

  // A line question is anchorable when its file block is rendered AND a .diff-line
  // row for its lineEnd/side exists. Anchorable → the thread renders inline, in the
  // slot the composer occupied, next to the code it is about. Un-anchorable (the
  // file went to overflowFiles, or the line falls outside every rendered hunk) →
  // the fallback panel, so a Q&A pair can never silently vanish.
  // Returns the thread ids that could not be placed.
  function renderLineThreads(list) {
    // These threads are siblings of .diff-line rows, NOT children of .anno cards,
    // so renderAnnotations() does not clear them and nothing else will: this pass
    // owns their whole lifetime. Rebuild from scratch every time, then drop hosts
    // left holding nothing, so repeat calls converge instead of accumulating.
    Array.prototype.forEach.call(document.querySelectorAll(".qa-thread-list > .qa-thread"),
      function (n) { n.remove(); });
    var unplaced = [];
    threadIdsOf(list).forEach(function (tid) {
      var chain = list.filter(function (q) { return q.threadId === tid; });
      var t = chain.length ? chain[0].target : null;
      var row = t ? findDiffRow(t.filePath, t.side, t.lineEnd) : null;
      if (!row) { unplaced.push(tid); return; }
      var host = ensureRowHost(row, "qa-thread-list", "qa-anchor",
        anchorKey(t.filePath, t.side, t.lineEnd));
      // No qa-target label: the thread is sitting on the lines it names.
      var node = buildThreadNode(tid, list,
        { showTarget: false, note: QA_INLINE_NOTE, composerHost: host });
      var openComposerNode = host.querySelector(".qa-composer");
      if (openComposerNode) host.insertBefore(node, openComposerNode);
      else host.appendChild(node);
    });
    Array.prototype.forEach.call(document.querySelectorAll(".qa-thread-list"),
      function (h) { if (!h.childElementCount) h.remove(); });
    return unplaced;
  }

  // Session-level state (terminal states, the pending lockout) used to live in the
  // questions panel. That panel now hides itself whenever it is empty, so this
  // moved out to stay visible on its own.
  function buildQaStatusHost() {
    qaStatusHost = el("div", "qa-status-block");
    qaStatusHost.id = "qa-session-status";
    qaStatusHost.style.display = "none";
    document.getElementById("shell-notices").appendChild(qaStatusHost);
  }

  function renderQaStatus() {
    if (!qaStatusHost) return;
    clearNode(qaStatusHost);
    var pending = pendingQuestions().length;
    if (qaQuestions.length) {
      qaStatusHost.appendChild(el("div", "qa-status-line",
        qaQuestions.length + " question" + (qaQuestions.length === 1 ? "" : "s") +
        " asked · " + pending + " waiting"));
    }
    if (qaState === "stale") {
      qaStatusHost.appendChild(el("div", "qa-notice",
        "Stale session. This page was opened for an earlier review run, so the server " +
        "refused it. Asking is disabled. Use \u201cDownload annotations\u201d to save your review."));
    } else if (qaState === "ended") {
      qaStatusHost.appendChild(el("div", "qa-notice",
        "Session ended. The review server stopped responding (timeout, submit elsewhere, " +
        "or crash). Asking is disabled and answers will no longer arrive. Your annotations " +
        "are intact - use \u201cDownload annotations\u201d to hand them back."));
    } else if (pending >= MAX_PENDING) {
      qaStatusHost.appendChild(el("div", "qa-notice",
        "Waiting on " + MAX_PENDING + " questions. Asking is paused until one is answered."));
    }
    qaStatusHost.style.display = qaStatusHost.childElementCount ? "" : "none";
    // The stop control no longer renders into this host - it is fixed to the viewport
    // now - but it is still driven from here, so it stays derived from speechSpeaking
    // on the same every-tick pass that rebuilds everything else above.
    renderSpeechStopPill();
  }

  // Fallback host only: threads whose lines are not on this page. Empty is the
  // normal case, and an empty panel would just be a scrap of UI to scroll past.
  function buildQaPanel() {
    if (!qaEnabled) return;
    buildQaStatusHost();
    qaPanel = el("section", "panel qa-panel");
    qaPanel.id = "qa-panel";
    qaPanel.style.display = "none";
    var head = el("div", "panel-head");
    head.appendChild(el("span", null, "Questions the diff can't show"));
    head.appendChild(el("span", "qa-sub", "not part of your review · never posted to GitHub"));
    head.appendChild(el("span", "toggle", "▾ collapse"));
    head.addEventListener("click", function () {
      qaPanel.classList.toggle("collapsed");
      head.querySelector(".toggle").textContent =
        qaPanel.classList.contains("collapsed") ? "▸ expand" : "▾ collapse";
    });
    qaPanel.appendChild(head);
    qaPanelBody = el("div", "panel-body");
    qaPanel.appendChild(qaPanelBody);
    document.querySelector(".wrap").appendChild(qaPanel);
  }

  function renderFallbackPanel(unplaced, list) {
    if (!qaEnabled || !qaPanel || !qaPanelBody) return;
    // Detach (not destroy) an open composer so its typed text survives a re-render.
    var keep = qaPanelBody.querySelector(".qa-composer");
    if (keep) keep.remove();
    clearNode(qaPanelBody);
    if (!unplaced.length && !keep) {
      qaPanel.style.display = "none";
      return;
    }
    qaPanel.style.display = "";
    qaPanelBody.appendChild(el("p", "qa-empty",
      "These questions point at lines this page does not render - the file is in the " +
      "overflow list, or the line falls outside every hunk shown - so they cannot sit " +
      "next to the code."));
    unplaced.forEach(function (tid) {
      qaPanelBody.appendChild(buildThreadNode(tid, list,
        { showTarget: true, composerHost: qaPanelBody }));
    });
    if (keep) qaPanelBody.appendChild(keep);
  }

  function updateAskAvailability() {
    if (!qaEnabled) return;
    var allowed = canAsk();
    var reason = allowed ? "" : askBlockedReason();
    Array.prototype.forEach.call(
      document.querySelectorAll(".qa-ask-btn, .qa-ask-lines-btn, .qa-followup-btn, .request-background-btn"),
      function (b) { b.disabled = !allowed; b.title = reason; });
  }

  function renderQa() {
    if (!qaEnabled) return;
    renderAnnotationThreads();
    var lines = lineQuestions();
    renderFallbackPanel(renderLineThreads(lines), lines);
    renderQaStatus();
    updateAskAvailability();
  }

  // ---- polling (§5.5): GET /answers every ~2s while anything is pending ----

  function ensurePolling() {
    if (!qaEnabled) return;
    var wanted = qaState === "active" && pendingQuestions().length > 0;
    if (wanted && qaPollTimer === null) {
      qaPollTimer = setInterval(pollAnswers, POLL_INTERVAL_MS);
    } else if (!wanted && qaPollTimer !== null) {
      clearInterval(qaPollTimer); qaPollTimer = null;
    }
  }

  function pollAnswers() {
    fetch("/answers", { cache: "no-store" }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }).then(function (data) {
      qaPollFailures = 0;
      attachAnswers(data && Array.isArray(data.answers) ? data.answers : []);
    }).catch(function () {
      qaPollFailures += 1;
      if (qaPollFailures >= POLL_FAILURES_BEFORE_END) endQaSession("ended");
      else renderQa();   // keep the elapsed counters ticking through a blip
    });
  }

  function attachAnswers(answers) {
    var gotAnswer = false;
    var gotBackground = false;
    var speakQids = [];
    answers.forEach(function (ans) {
      if (!ans || typeof ans.qid !== "string") return;
      var q = qaByQid[ans.qid];
      if (!q || q.answered) return;
      q.answered = true;
      q.answer = typeof ans.body === "string" ? ans.body : "";
      gotAnswer = true;
      // Only answers to dictated questions speak themselves, and only on this first
      // transition to answered - the guard above is what keeps a re-poll from
      // repeating them. A background-request answer has no body to speak.
      if (q.answer && q.kind !== "background-request" && voiceQids.has(q.qid)) {
        speakQids.push(q.qid);
      }
      if (q.kind === "background-request" && typeof ans.background === "string" && ans.background) {
        var target = null;
        aiAnnotations.forEach(function (a) { if (a.id === q.target.annotationId) target = a; });
        // Flows straight into stripInternal() → submit payload → GitHub <details>.
        if (target) { target.background = ans.background; gotBackground = true; }
      }
    });
    if (speakQids.length) {
      // qaQuestions is in ask order, so walking it is askedAt order without a sort:
      // two answers landing in one tick queue up, they never talk over each other.
      qaQuestions.forEach(function (q) {
        if (speakQids.indexOf(q.qid) !== -1) enqueueSpeech(toSpeechText(q.answer), q.qid);
      });
    }
    if (gotBackground) renderAnnotations();   // details block appears, button goes away
    if (gotAnswer || !gotBackground) renderQa();
    ensurePolling();
  }

  function endQaSession(reason) {
    if (qaState !== "active") return;
    qaState = reason === "stale" ? "stale" : "ended";
    if (qaPollTimer !== null) { clearInterval(qaPollTimer); qaPollTimer = null; }
    abortQaDictation();
    stopSpeaking();   // no voice outliving the session it belongs to
    closeQaComposer();
    // Re-show the no-server fallback path: whatever happened to the session, the
    // reviewer must still be able to save their decisions.
    if (downloadBtn) downloadBtn.style.display = "";
    renderQa();
  }

  function buildTranscript() {
    // annotation-schema.md §3/§5.9. NEVER posted to GitHub, never in the fix-list;
    // it exists so the agent can see what was asked alongside the decisions.
    return qaQuestions.map(function (q) {
      return {
        qid: q.qid,
        threadId: q.threadId,
        target: q.target,
        body: q.body,
        answer: q.answered ? (q.answer != null ? q.answer : "") : null,
        answered: q.answered === true
      };
    });
  }

  function hasUnsavedWork() {
    if (userAnnotations.length) return true;
    if (qaQuestions.length) return true;
    if (generalComment && generalComment.trim()) return true;
    return aiAnnotations.some(function (a) { return a.accepted || a._discarded; });
  }

  function onBeforeUnload(ev) {
    if (submitted || !hasUnsavedWork()) return;
    ev.preventDefault();
    ev.returnValue = "";
    return "";
  }

  var submitBtn = document.getElementById("submit-btn");
  var downloadBtn = document.getElementById("download-btn");
  var copyFixlistBtn = document.getElementById("copy-fixlist-btn");
  // The top bar's button is a forwarder, not a second implementation: the design
  // offers submit in both places, but there must stay exactly one submit path.
  // Its disabled state is mirrored by observing the real button rather than by
  // editing the five places that mutate it, so the two can never disagree.
  var submitBtnTop = document.getElementById("submit-btn-top");
  submitBtnTop.addEventListener("click", function () { submitBtn.click(); });
  new MutationObserver(function () {
    submitBtnTop.disabled = submitBtn.disabled;
  }).observe(submitBtn, { attributes: true, attributeFilter: ["disabled"] });
  if (!isLive) {
    submitBtn.style.display = "none"; // no server → download only
    submitBtnTop.style.display = "none";
  }
  // PR mode has no fix-list: accepted comments go to GitHub as a pending review.
  if (DATA.mode !== "local") copyFixlistBtn.style.display = "none";

  copyFixlistBtn.addEventListener("click", function () {
    var md = buildFixlistMarkdown();
    var btn = this;
    var original = btn.textContent;

    // writeText must be called synchronously in the click handler: Safari ties
    // clipboard access to transient activation, which an intervening await drops.
    var p = navigator.clipboard
      ? navigator.clipboard.writeText(md)
      : Promise.reject(new Error("no clipboard API"));
    p.then(function () {
      btn.textContent = "✓ Copied";
      setTimeout(function () { btn.textContent = original; }, 2000);
    }).catch(function () {
      // Off-screen, NOT display:none; hidden elements can't be selected.
      var ta = document.createElement("textarea");
      ta.value = md;
      ta.style.cssText = "position:fixed;left:-9999px;top:0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        btn.textContent = "✓ Copied";
      } catch (e) {
        btn.textContent = "Copy failed";
      }
      setTimeout(function () {
        btn.textContent = original;
        document.body.removeChild(ta);
      }, 2000);
    });
  });

  submitBtn.addEventListener("click", function () {
    var waiting = qaEnabled ? pendingQuestions().length : 0;
    if (waiting > 0 && !window.confirm(
        "You have " + waiting + " unanswered question" + (waiting === 1 ? "" : "s") +
        ". Submit anyway?")) {
      return;
    }
    var payload = buildPayload();
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";
    fetch("/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      submitted = true;   // review is in the agent's hands: no beforeunload nag
      if (qaPollTimer !== null) { clearInterval(qaPollTimer); qaPollTimer = null; }
      submitBtn.textContent = "✓ Sent. You can close this tab";
    }).catch(function () {
      // Server gone? Fall back to a download so the review isn't lost.
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit review";
      download(payload);
    });
  });

  downloadBtn.addEventListener("click", function () { download(buildPayload()); });

  function download(payload) {
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "pr-annotations.json";
    document.body.appendChild(a); a.click(); a.remove();
  }

  var generalTa = document.getElementById("general-comment");
  generalTa.addEventListener("input", function () {
    generalComment = generalTa.value; saveDraft();
  });

  watchTopbarHeight();

  Array.prototype.forEach.call(document.querySelectorAll("[data-toggle]"), function (h) {
    h.addEventListener("click", function () {
      var panel = document.getElementById(h.dataset.toggle);
      panel.classList.toggle("collapsed");
      var t = h.querySelector(".toggle");
      if (t) t.textContent = panel.classList.contains("collapsed") ? "Expand" : "Collapse";
    });
  });

  seedFromData();
  loadDraft();
  renderShell();
  renderFiles();
  renderOverflow();
  // After renderFiles (it anchors into rendered diff rows) and before
  // renderAnnotations only for readability: ROW_HOST_ORDER, not call order, is
  // what decides whether existing threads sit above the reviewer's drafts.
  renderExistingActivity();
  if (qaEnabled) buildQaPanel();   // before renderAnnotations: threads need a host
  renderAnnotations();
  generalTa.value = generalComment;
  // Before renderCounts: it calls applyFilters(), which reads the pill elements.
  initFilters();
  renderCounts();
  initScrollSpy();
  if (qaEnabled) {
    renderQa();
    // Live-Q&A only, deliberately: questions are the one piece of page state with
    // no localStorage backing (annotations and the general comment are drafted
    // through saveDraft()), and the fallback page must behave exactly as before.
    window.addEventListener("beforeunload", onBeforeUnload);
    // Leaving or backgrounding the page must not leave a voice running behind it.
    window.addEventListener("pagehide", function () { stopSpeaking(); });
    // Esc is the reflex for "make it stop", and it is the one route to silence that
    // needs neither the mouse nor knowing where the pill is. It acts only while
    // something is actually being read, and it neither preventDefault()s nor stops
    // propagation, so an Esc meant for a composer, a native autocomplete, or the
    // browser's own find bar still reaches it.
    document.addEventListener("keydown", function (ev) {
      if (ev.key !== "Escape" || !speechSpeaking) return;
      stopSpeaking();
      renderQaStatus();
    });
  }
})();
</script>
</body>
</html>
